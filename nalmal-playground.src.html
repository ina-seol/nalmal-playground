<title>낱말 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<!--FONTS-->
<style id="app-style">
/* Layout: 다마고치 액정 화면 + 닌텐도 카트리지. 밝은 교실용 라이트 테마 하나, 가운데 한 단(최대 1180px). 놀이마다 브랜드 색 하나 */
:root{
  --royal:#2B4789; --royal-dk:#1A1C21; --ink:#1A1C21; --ink-soft:#6B6F76;
  --melon:#E36D98; --melon-lt:#FBE3EC; --canary:#E7DD6A; --canary-lt:#F8F4CC;
  --lime:#A0CB75; --lime-lt:#E6F2D9; --emerald:#10B183; --emerald-lt:#D4F1E7;
  --bg:#FFFFFF; --dot:transparent; --shell:#FFFFFF; --line:#E4E5E9;
  --lcd:#F4F5F7; --lcd-ink:#1A1C21; --lcd-dot:transparent;
  --good:#0A7F5E; --bad:#B8325C; --sky1:#BCCDEF; --sky2:#F4F6FC; --lilac:#D7CFF3; --peach:#FAD9C4; --mole:#A47148;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px -4px rgba(16,24,40,.08); --shadow-sm:0 1px 2px rgba(16,24,40,.08);
  --drop:var(--shadow);
  --font:"Aggravo","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-pixel:var(--font);
  --r-panel:18px; --r-ctl:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--royal) var(--bg)}
body{
  background-color:var(--bg); color:var(--ink);
  font-family:var(--font); font-weight:500; font-size:16px; line-height:1.5; caret-color:var(--melon);
  word-break:keep-all; overflow-wrap:break-word;
}
::selection{background:var(--canary);color:var(--ink)}
#app{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:14px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--royal);outline-offset:3px}
h1,h2,h3{font-weight:700;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}

/* plastic keys */
.btn{--fill:var(--shell);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;white-space:nowrap;
  font-weight:500;font-size:17px;padding:8px 18px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--fill);color:var(--ink);
  box-shadow:var(--shadow);transition:transform .12s cubic-bezier(.2,.9,.3,1),box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active:not(:disabled){transform:scale(.97);box-shadow:var(--shadow-sm)}
.btn:disabled{opacity:.5;box-shadow:var(--shadow-sm)}
.btn.primary{--fill:var(--ink);color:#fff}
.btn.melon{--fill:var(--melon)}
.btn.on{--fill:var(--lime-lt)}
.btn.small{min-height:40px;font-size:15px;padding:5px 12px;border-width:2.5px;box-shadow:var(--shadow-sm)}
.btn.small:active:not(:disabled){transform:scale(.97);box-shadow:var(--shadow-sm)}
.kbd{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;font-family:var(--font-pixel);font-size:13px;line-height:1;
  color:var(--ink-soft);background:var(--shell);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px}
.btn .kbd{margin-left:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:0 14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;font-weight:700;font-size:26px;color:var(--royal-dk);border-radius:var(--r-ctl)}
.brand svg{width:40px;height:48px;transform:rotate(-6deg);transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.brand:hover svg{transform:rotate(6deg)}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}

/* home: LCD */
.lcd{position:relative;display:grid;gap:10px;padding:14px 22px 18px;margin-bottom:18px;background-color:var(--lcd);color:var(--lcd-ink);
  border:0;border-radius:20px}
.lcd h1{font-size:clamp(26px,3.4vw,38px)}
.lcd-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--font-pixel);font-size:17px}
.tag{font-family:var(--font);font-weight:500;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--lcd-ink);color:var(--lcd)}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip span{display:inline-flex;gap:6px;align-items:baseline;border:2px solid rgba(34,56,30,.35);border-radius:10px;padding:2px 10px;font-weight:300;font-size:15px;background:rgba(255,255,255,.28)}
.strip b{font-family:var(--font-pixel);font-weight:400;font-size:16px}
.lcd-top{display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lcd-head{display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap;min-width:0}
.unit-all{display:flex;gap:8px;flex-wrap:wrap}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px}
.unit{display:flex;align-items:center;gap:6px;min-height:40px;padding:3px 10px;text-align:left;font-weight:500;font-size:15px;line-height:1.2;
  color:var(--ink);background:var(--shell);border:1px solid var(--line);border-radius:999px;transition:transform .1s,background-color .12s}
.unit:hover{transform:translateY(-2px)}
.unit:active{transform:scale(.97);box-shadow:var(--shadow-sm)}
.unit .chk{flex:none;display:grid;place-items:center;width:20px;height:20px;border:1.5px solid #C9CBD1;border-radius:6px;background:var(--shell)}
.unit .chk .ico{width:15px;height:15px;stroke-width:3.4}
.unit .num{flex:none;min-width:1.2em;font-family:var(--font-pixel);font-size:17px}
.unit .ut{min-width:0;overflow-wrap:normal}
.unit.on{background:var(--canary-lt);border-color:var(--canary);color:var(--ink)}
.unit.on .chk{background:var(--canary);border-color:var(--canary);color:var(--ink)}
.unit-name{font-family:var(--font);font-weight:700;font-size:18px;margin-right:6px}
@media (max-width:1000px){.units{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}.unit{font-size:13px;padding:3px 7px;gap:5px}.unit .num{font-size:15px}}
.utag{display:inline-block;vertical-align:middle;margin-left:10px;font-family:var(--font-pixel);font-size:15px;font-weight:400;padding:2px 9px;border-radius:8px;background:var(--lcd);color:var(--lcd-ink);border:1px solid var(--line)}
@keyframes boot{0%{filter:brightness(1.35) contrast(.6)}100%{filter:none}}
/* grade picker */
.pick-lcd{margin-bottom:24px}
.pick-hint{margin:0;font-weight:500;font-size:17px}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.set-card{display:flex;align-items:center;gap:20px;padding:16px 20px 16px 16px;text-align:left;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);
  box-shadow:var(--shadow);transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s}
.set-card:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.set-card:active:not(:disabled){transform:scale(.97);box-shadow:var(--shadow-sm)}
.set-card:disabled{opacity:.6;filter:grayscale(.6)}
.set-num{display:grid;place-items:center;align-content:center;gap:2px;width:118px;aspect-ratio:1;flex:none;background:var(--c);color:var(--ink);border:0;border-radius:16px}
.set-num b{font-family:var(--font-pixel);font-weight:400;font-size:64px;line-height:.9}
.set-num small{font-weight:700;font-size:16px}
.set-body{display:grid;gap:6px;flex:1;min-width:0}
.set-body b{font-size:clamp(22px,2.4vw,28px);font-weight:700;color:var(--royal-dk)}
.set-body small{font-weight:300;font-size:16px;color:var(--ink-soft)}
@media (max-width:700px){.sets{grid-template-columns:minmax(0,1fr);gap:16px}.set-num{width:84px}.set-num b{font-size:44px}}
.notice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:-8px 0 22px;padding:10px 16px;
  background:var(--canary-lt);border:1px dashed var(--line);border-radius:var(--r-panel)}
.notice p{margin:0;flex:1 1 260px;min-width:0;font-weight:300}
.notice b{font-weight:700}

/* cartridges */
.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* 가로형 카드: 그림은 왼쪽, 이름·설명·별은 오른쪽. 놀이 12개가 크롬북 한 화면에 들어오도록 */
.cart{--c:var(--melon);position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);align-items:stretch;gap:12px;padding:8px;text-align:left;
  background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow-sm);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s}
.cart:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.cart:active:not(:disabled){transform:scale(.97);box-shadow:var(--shadow-sm)}
.cart:disabled{filter:grayscale(.7);opacity:.75}
.cart .ill{position:relative;min-height:74px;display:grid;place-items:center;background:var(--c);border-radius:12px}
/* 단축키는 그림 왼쪽 위, 별은 그림 아래에 얹어 카드 높이를 줄입니다 */
.cart .ill .kbd{position:absolute;top:4px;left:4px;min-width:22px;height:20px;font-size:12px}
.cart .ill .stars{position:absolute;bottom:3px;left:50%;translate:-50% 0;gap:0;padding:1px 3px;background:var(--shell);border-radius:999px}
.cart .ill .stars .ico{width:14px;height:14px}
.cart .ill svg{width:74px;height:auto;max-width:100%}
.ill .f{fill:var(--shell);stroke:var(--royal-dk);stroke-width:2.6}
.ill .h{fill:var(--canary-lt);stroke:var(--royal-dk);stroke-width:2.6}
.ill .s{fill:none;stroke:var(--royal-dk);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ill .w{fill:none;stroke:var(--shell);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ill text{font-family:var(--font);font-weight:700;font-size:14px;fill:var(--royal-dk)}
.label{display:grid;align-content:center;gap:3px;padding:2px 2px 2px 0;min-width:0}
.label h2{font-size:19px}
.label p{margin:0;font-weight:300;font-size:14px;line-height:1.35;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.label p.need{color:var(--bad);font-weight:500}
.stars{display:inline-flex;gap:2px;align-items:center}
.stars .ico{width:18px;height:18px;fill:var(--line);stroke:none}
.stars .on{fill:var(--canary);stroke:var(--royal-dk);stroke-width:1.6}

/* game screen */
.ghead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding-block:0 10px}
.ghead h2{font-size:clamp(24px,3.4vw,32px);color:var(--royal-dk)}
.stats{display:flex;align-items:center;gap:8px;font-family:var(--font-pixel);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;
  background-color:var(--lcd);color:var(--lcd-ink);border:0;border-radius:999px;padding:6px 16px}
.stats .ico{width:18px;height:18px}
.howto{margin:0 0 18px;font-weight:300;color:var(--ink-soft);max-width:70ch}
.howto .kbd{margin-inline:2px}
.tools{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:12px;margin:0 auto}
.mcard{position:relative;aspect-ratio:.78;border:0;padding:0;background:none;border-radius:16px;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.7,.3,1.25)}
.mcard.open{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;border:1px solid var(--line);border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-content:center;gap:4px;text-align:center;padding:8px;box-shadow:var(--shadow-sm)}
.mface.back{place-content:normal;place-items:center;background-color:var(--melon);background-image:radial-gradient(rgba(255,255,255,.55) 2px,transparent 2.6px);background-size:14px 14px}
.mface.back svg{width:40%;max-width:64px;height:auto}
.mface.front{transform:rotateY(180deg);background:var(--shell);place-content:center stretch}
.mface small{font-size:13px;font-weight:300;color:var(--ink-soft)}
.mface b{font-weight:700;font-size:clamp(14px,1.9vw,22px);line-height:1.15}
.mcard.matched .front{background:var(--lime-lt)}
.mcard.matched{animation:bump .45s}

/* shisen */
.ss-layout{display:flex;gap:18px;justify-content:center;align-items:flex-start}
.ss-wrap{position:relative;width:100%;margin:0}
.ss-tools{flex-direction:column;margin-top:0;flex:none}
@media (max-width:900px){.ss-layout{flex-direction:column;align-items:center}.ss-tools{flex-direction:row;margin-top:16px}}
.ss-board{display:grid;grid-template-columns:16px repeat(var(--cols),minmax(0,1fr)) 16px;grid-template-rows:16px repeat(var(--rows),auto) 16px;
  background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.ss-cell.in{aspect-ratio:var(--asp,1);margin:4px;min-height:0;min-width:0;overflow:hidden}
.ss-rock{border-radius:10px;border:1px solid var(--line);background-color:var(--royal);background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.6px),radial-gradient(rgba(0,0,0,.18) 2px,transparent 2.6px);background-size:12px 12px,12px 12px;background-position:0 0,6px 6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.ss-tile{border:1px solid var(--line);border-radius:12px;background:var(--shell);box-shadow:var(--shadow-sm);
  font-weight:700;font-size:clamp(13px,2.1vw,19px);line-height:1.1;padding:3px;color:var(--ink);transition:transform .12s,opacity .25s,background-color .12s}
.ss-tile.m{background:var(--emerald-lt);font-weight:500}
.ss-tile.long{font-size:clamp(11px,1.7vw,15px)}
.ss-tile.sel{background:var(--canary);transform:translateY(-4px);box-shadow:var(--shadow-sm)}
.ss-tile.hint{animation:pulse .7s 3}
.ss-tile.vanish{opacity:0;transform:scale(.5) rotate(8deg)}
/* inside game tiles a word never breaks mid-word; fit() shrinks it instead */
.ss-tile,.mg-word b,.mface b,.balloon{overflow-wrap:normal;word-break:keep-all}
.ss-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ss-line polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ss-line .under{stroke:var(--royal-dk);stroke-width:10}
.ss-line .over{stroke:var(--melon);stroke-width:5}

/* merge */
.mg{display:grid;grid-template-columns:minmax(0,min(440px,max(320px,calc(100dvh - 260px)))) minmax(220px,300px);gap:28px;justify-content:center;align-items:start}
.mg-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:10px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.mg-cell{aspect-ratio:1;border:1px dashed var(--line);border-radius:12px;background:var(--bg);padding:0;display:grid;overflow:hidden;min-width:0;transition:transform .12s}
.mg-cell.has{border:1px solid var(--line);background:var(--shell);box-shadow:var(--shadow-sm)}
.mg-cell.sel{transform:translateY(-4px);box-shadow:var(--shadow-sm);outline:4px solid var(--melon);outline-offset:2px}
.mg-word{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:3px;gap:0;min-width:0}
.mg-word small{font-size:11px;font-weight:300;color:var(--ink-soft)}
.mg-cell.tight .mg-word small{display:none}
.mg-cell{container-type:inline-size}
.mg-word b{font-weight:700;font-size:clamp(11px,26cqi,18px);line-height:1.1}
.mg-word b.long{font-size:clamp(10px,19cqi,15px)}
.mg-word b.xlong{font-size:clamp(9px,15cqi,13px)}
.mg-word.m{background:var(--canary-lt);border-radius:9px}
.mg-word.m b{font-weight:500}
.mg-star{display:grid;place-content:center;justify-items:center;gap:1px;border-radius:9px;color:var(--ink)}
.mg-star svg{width:56%;height:auto;fill:var(--shell);stroke:var(--royal-dk);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.mg-star small{font-family:var(--font-pixel);font-size:12px;line-height:1}
.lv1{background:var(--canary)} .lv2{background:var(--lime)} .lv3{background:var(--melon)} .lv4{background:var(--emerald)}
.lv5{background:var(--sky1)} .lv6{background:var(--melon-lt)} .lv7{background:var(--lime-lt)} .lv8{background:var(--canary-lt)}
/* levels 9-16: the same shapes on a gold plate */
.gold{background:linear-gradient(140deg,#FFF6B8,var(--canary) 55%,#C99A22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.gold svg{fill:#FFF8D6}
.mg-side{display:grid;gap:16px;align-content:start}
.mg-side .btn{width:100%;font-size:19px;min-height:56px}
.goal{display:grid;gap:10px;padding:16px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel)}
.goal h3{font-size:17px}
.ladder{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.ladder i{display:grid;place-items:center;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);opacity:.28;filter:grayscale(1)}
.ladder i.got{opacity:1;filter:none}
.ladder svg{width:68%;fill:var(--shell);stroke:var(--royal-dk);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.goal ul{margin:0;padding-left:18px;display:grid;gap:4px;font-weight:300;font-size:15px}
.goal b{font-weight:700}




.pop{animation:bump .35s}
.shake{animation:shake .35s}

/* sentence */
.sp{max-width:820px;margin:0 auto;display:grid;gap:20px}
.sp-line{position:relative}
.gain{position:absolute;right:16px;top:-14px;font-family:var(--font-pixel);font-size:26px;color:var(--good);background:var(--shell);border:1px solid var(--line);border-radius:10px;padding:0 10px;animation:gain 1s ease-out forwards}
@keyframes gain{0%{transform:translateY(10px) scale(.7);opacity:0}25%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-18px);opacity:0}}
.sp-count{margin:0;font-family:var(--font-pixel);color:var(--ink-soft);text-align:center}
.sp-line{min-height:88px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:14px 16px 26px;
  background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);
  background-image:linear-gradient(transparent calc(100% - 18px),var(--line) calc(100% - 18px),var(--line) calc(100% - 15px),transparent calc(100% - 15px))}
.sp-line.good{background-color:var(--lime-lt)}
.sp-line.bad{animation:shake .4s}
.sp-ph{color:var(--ink-soft);font-weight:300}
.sp-pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{min-height:52px;font-weight:700;font-size:clamp(19px,2.6vw,26px);padding:6px 16px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--shell);
  box-shadow:var(--shadow-sm);transition:transform .1s}
.chip:active{transform:scale(.97);box-shadow:var(--shadow-sm)}
.chip.placed{background:var(--emerald-lt)}
.chip.ghost{opacity:.3;border-style:dashed;box-shadow:none}

/* balloon */
.bl{display:grid;gap:14px;max-width:860px;margin:0 auto}
.bl-q{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.bl-q small{color:var(--ink-soft);font-weight:300;font-size:16px}
.bl-q b{font-weight:700;font-size:clamp(28px,5vw,42px);background:var(--canary);border:1px solid var(--line);border-radius:var(--r-ctl);padding:2px 18px;box-shadow:var(--shadow-sm)}
.bl-sky{position:relative;height:clamp(280px,calc(100dvh - 350px),460px);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;
  background:linear-gradient(var(--sky1),var(--sky2));box-shadow:var(--shadow)}
.balloon{--bw:104px;position:absolute;top:0;width:var(--bw);height:calc(var(--bw)*1.18);border:1px solid var(--line);border-radius:50% 50% 47% 47%;
  background:var(--bc);color:var(--ink);font-weight:700;font-size:19px;line-height:1.1;padding:8px 6px 18px;display:grid;place-items:center;
  will-change:transform;touch-action:manipulation}
.balloon::before{content:"";position:absolute;left:20%;top:13%;width:17%;height:21%;border-radius:50%;background:var(--shell);opacity:.6}
.balloon::after{content:"";position:absolute;left:calc(50% - 1.5px);bottom:-38px;width:3px;height:36px;background:var(--royal-dk)}
.balloon .k{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:var(--font-pixel);font-size:12px;font-weight:400;
  background:var(--shell);border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:16px}
.balloon.c0{--bc:var(--melon)} .balloon.c1{--bc:var(--canary)} .balloon.c2{--bc:var(--lime)} .balloon.c3{--bc:var(--emerald)}
.balloon.long{font-size:15px}
.balloon.xlong{font-size:12px}
.balloon.popped{animation:popped .35s forwards}
.balloon.wrong{--bc:var(--line);opacity:.55;animation:shake .35s}
.hearts{display:inline-flex;gap:2px}
.hearts .ico{fill:var(--melon);stroke:var(--royal-dk);stroke-width:1.6}
.hearts .off{fill:transparent;stroke:var(--lcd-ink);opacity:.35}
.bl-start{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:16px}
.bl-start p{margin:0;max-width:32ch;font-weight:300}

/* solitaire: 위쪽 줄 = 덱·버린 카드·짝 칸, 아래 = 카드 열. 열은 맨 위 카드만 앞면 */
.so{position:relative;width:100%;display:grid;gap:14px;margin:0 auto}
.so-row,.so-tab{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px;align-items:start}
.so-col{display:flex;flex-direction:column;min-width:0}
/* 겹친 카드: 세로 여백 %는 열 너비 기준이라, 카드 높이(너비/.72)에서 너비의 24%만 보이게 당깁니다 */
.so-col>*+*{margin-top:calc(-100% / .72 + 24%)}
.so-card,.so-empty{position:relative;width:100%;aspect-ratio:.72;min-width:0;border-radius:12px;padding:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;container-type:inline-size}
.so-card{border:1px solid var(--line);background:var(--shell);color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .12s,opacity .25s}
.so-card small{font-size:12px;font-weight:300;color:var(--ink-soft);line-height:1}
.so-card b{font-weight:700;font-size:clamp(11px,21cqi,22px);line-height:1.15;max-width:100%}
.so-card.m{background:var(--canary-lt)}
.so-card.m b{font-weight:500}
.so-back{background-color:var(--royal);background-image:radial-gradient(rgba(255,255,255,.4) 2px,transparent 2.6px);background-size:12px 12px;border-color:var(--royal-dk)}
.so-stock{color:var(--shell)}
.so-stock .so-count{font-family:var(--font-pixel);font-size:clamp(16px,24cqi,26px);background:var(--royal-dk);border-radius:999px;padding:0 10px;line-height:1.4}
.so-stock small{color:var(--shell)}
.so-empty{border:2px dashed #C9CBD1;background:var(--lcd);color:var(--ink-soft);box-shadow:none}
.so-empty small{font-size:13px;font-weight:300}
span.so-empty{border-color:var(--line)}
.so-card.sel{transform:translateY(-5px);outline:4px solid var(--melon);outline-offset:2px;z-index:1}
.so-card.hint,.so-empty.hint{animation:pulse .7s 3}
.so-card.vanish{opacity:0;transform:scale(.6) rotate(6deg)}
.so-col .so-card:last-child.flip{animation:bump .35s}
.so .gain{right:auto;white-space:nowrap;font-size:20px;z-index:2}
.so-card b{overflow-wrap:normal;word-break:keep-all}
@media (max-width:560px){.so-row,.so-tab{gap:6px}.so-card,.so-empty{border-radius:9px;padding:2px}.so-card small{font-size:10px}.so-empty small{font-size:11px}}

/* snake: 캔버스 판 + 뜻과 철자 칸. 터치 화면에는 방향 버튼 */
.sn{display:grid;gap:10px;justify-items:center;max-width:1000px;margin:0 auto}
.sn-q{display:flex;align-items:center;justify-content:center;gap:10px 16px;flex-wrap:wrap;text-align:center}
.sn-q small{color:var(--ink-soft);font-weight:300;font-size:16px}
.sn-q b{font-weight:700;font-size:clamp(24px,4vw,34px);background:var(--emerald-lt);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 16px;box-shadow:var(--shadow-sm)}
.sn-slots{display:flex;gap:6px;min-height:44px}
.sn-slots span{display:grid;place-items:center;width:34px;height:42px;border-bottom:4px solid var(--line);font-weight:700;font-size:28px;line-height:1;color:var(--ink)}
.sn-slots span.on{border-color:var(--emerald)}
.sn-slots span.next{border-color:var(--canary)}
.sn-wrap{position:relative;width:100%}
.sn-wrap canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--lcd);box-shadow:var(--shadow);touch-action:none}
.sn-wrap .gain{top:12px;left:50%;right:auto;translate:-50% 0;white-space:nowrap}
.sn-pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.sn-pad .btn{min-height:52px;padding:0}
.sn-pad .up{grid-column:2}
@media (hover:hover) and (pointer:fine){.sn-pad{display:none}}

/* tetris: 줄마다 블록이 쌓이는 판 + 옆에 다음 블록과 진행 */
.tt{display:flex;gap:22px;justify-content:center;align-items:flex-start}
.tt-wrap{position:relative;width:100%;flex:0 1 auto}
.tt-board{position:relative;width:100%;overflow:hidden;background-color:var(--lcd);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);
  background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--cols)) 100%}
.tt-tile,.tt-ghost{position:absolute;padding:3px;display:flex}
.tt-tile b{flex:1;display:grid;place-items:center;min-width:0;overflow:hidden;text-align:center;padding:2px 4px;border:1px solid var(--line);border-radius:10px;background:var(--shell);
  box-shadow:var(--shadow-sm);font-weight:700;font-size:clamp(12px,1.9vw,19px);line-height:1.1;overflow-wrap:normal;word-break:keep-all;transition:opacity .25s,transform .25s}
.tt-tile.m b{background:var(--canary-lt);font-weight:500}
.tt-tile.fall b{outline:4px solid var(--melon);outline-offset:-1px}
.tt-tile.vanish b{opacity:0;transform:scale(.5) rotate(8deg)}
.tt-ghost::after{content:"";flex:1;border:2px dashed var(--melon);border-radius:10px;opacity:.55}
.tt-col{position:absolute;top:0;bottom:0;border:0;padding:0;background:transparent;z-index:2;border-radius:0}
.tt-col:hover{background:rgba(43,71,137,.06)}
.tt-wrap .gain{top:10px;left:50%;right:auto;translate:-50% 0;white-space:nowrap;z-index:3}
.tt-side{display:grid;gap:14px;width:220px;flex:none}
.tt-next{display:grid;gap:6px;padding:14px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel)}
.tt-next small{color:var(--ink-soft);font-size:14px}
.tt-next .tt-tile{position:relative;height:56px;padding:0}
.tt-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tt-pad .btn{padding:0}
@media (max-width:900px){.tt{flex-direction:column;align-items:center}.tt-side{width:100%;max-width:520px;grid-template-columns:1fr 1fr}.tt-pad{grid-column:1 / -1}}

/* match-3 */
.m3-wrap{position:relative;width:100%}
.m3-board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px;padding:10px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);touch-action:none}
.m3-cell{aspect-ratio:var(--asp,1.15);min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--shell);box-shadow:var(--shadow-sm);padding:3px;
  font-weight:700;font-size:clamp(12px,1.8vw,18px);line-height:1.1;color:var(--ink);overflow:hidden;transition:transform .15s,opacity .25s}
.m3-cell b{display:block;font-weight:inherit;overflow-wrap:normal;word-break:keep-all}
.m3-cell.m{background:var(--canary-lt);font-weight:500}
.m3-cell.sel{transform:translateY(-4px);outline:4px solid var(--melon);outline-offset:2px}
.m3-cell.hint{animation:pulse .7s 3}
.m3-cell.vanish{opacity:0;transform:scale(.4) rotate(10deg)}
.m3-cell.drop{animation:drop .3s cubic-bezier(.3,.7,.3,1.2)}
@keyframes drop{from{transform:translateY(-60%);opacity:0}}
.m3-wrap .gain{top:-12px;left:50%;right:auto;translate:-50% 0;white-space:nowrap}
.m3-goal{display:grid;gap:6px;padding:14px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);font-size:15px;font-weight:300}
.m3-goal b{font-family:var(--font-pixel);font-weight:400;font-size:26px}
@media (max-width:560px){.m3-board{gap:4px;padding:6px}.m3-cell{border-radius:9px;font-size:12px}}

/* fishing: 문장 빈칸 + 물고기가 헤엄치는 연못 */
.fs{display:grid;gap:12px;max-width:900px;margin:0 auto}
.fs-sent{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 10px;padding:14px 18px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);
  font-weight:700;font-size:clamp(22px,3.2vw,32px);line-height:1.3;min-height:72px}
.fs-blank{display:inline-block;min-width:var(--bw,4em);border-bottom:4px dashed var(--royal);text-align:center;color:var(--good)}
.fs-blank.got{border-bottom-style:solid;border-color:var(--emerald);background:var(--emerald-lt);border-radius:8px 8px 0 0;padding:0 6px}
.fs-pond{position:relative;height:clamp(220px,calc(100dvh - 380px),420px);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;
  background:linear-gradient(var(--sky1),#8FA9DE);box-shadow:var(--shadow)}
.fish{--bc:var(--canary);position:absolute;left:0;top:0;height:54px;min-width:96px;display:flex;align-items:center;justify-content:center;padding:0 26px 0 18px;
  border:1px solid var(--royal-dk);border-radius:28px 40px 40px 28px;background:var(--bc);color:var(--ink);font-weight:700;font-size:19px;white-space:nowrap;will-change:transform;touch-action:manipulation}
.fish::after{content:"";position:absolute;left:-20px;top:50%;width:24px;height:32px;translate:0 -50%;background:var(--royal-dk);clip-path:polygon(0 0,100% 50%,0 100%)}
.fish::before{content:"";position:absolute;right:11px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.fish.lf{padding:0 18px 0 26px;border-radius:40px 28px 28px 40px}
.fish.lf::after{left:auto;right:-20px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.fish.lf::before{right:auto;left:11px}
.fish.c0{--bc:var(--canary)} .fish.c1{--bc:var(--melon-lt)} .fish.c2{--bc:var(--lime)} .fish.c3{--bc:var(--shell)}
.fish .k{position:absolute;top:-10px;left:50%;translate:-50% 0;font-family:var(--font-pixel);font-size:12px;font-weight:400;background:var(--shell);border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:16px}
.fish.wrong{opacity:.45;animation:shake .35s}
.fish.caught{--bc:var(--emerald-lt)}
.fs-line{position:absolute;top:0;width:2px;background:var(--royal-dk);pointer-events:none}
@media (max-width:560px){.fish{height:46px;min-width:76px;font-size:16px;padding:0 20px 0 14px}.fish.lf{padding:0 14px 0 20px}}

/* ladder (wordle): 칸 격자 + 화면 자판 */
.ld{display:grid;gap:12px;justify-items:center;max-width:1000px;margin:0 auto}
.ld-q{display:flex;align-items:center;justify-content:center;gap:8px 14px;flex-wrap:wrap;text-align:center}
.ld-q small{color:var(--ink-soft);font-weight:300;font-size:16px}
.ld-q b{font-weight:700;font-size:clamp(24px,4vw,34px);background:var(--lilac);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 16px;box-shadow:var(--shadow-sm)}
.ld-main{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.ld-grid{--cell:clamp(30px,min(calc((100dvh - 330px) / 6 - 6px),calc((100vw - 40px) / var(--n) - 6px)),56px);display:grid;grid-template-columns:repeat(var(--n),var(--cell));gap:6px}
.ld-cell{width:var(--cell);height:var(--cell);display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;background:var(--shell);
  font-weight:700;font-size:calc(var(--cell) * .52);line-height:1}
.ld-cell.typed{border-color:var(--ink-soft);animation:bump .15s}
.ld-cell.g{background:var(--emerald);border-color:var(--emerald);color:#fff}
.ld-cell.y{background:var(--canary);border-color:var(--canary)}
.ld-cell.x{background:#C9CBD1;border-color:#C9CBD1;color:var(--ink)}
.ld-cell.flip{animation:flipin .45s both}
@keyframes flipin{0%{transform:rotateX(90deg)}100%{transform:none}}
.ld-grid .bad{animation:shake .35s}
.ld-keys{display:grid;gap:6px}
.ld-krow{display:flex;gap:5px;justify-content:center}
.ld-key{min-width:36px;height:46px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--shell);box-shadow:var(--shadow-sm);font-weight:700;font-size:17px;color:var(--ink)}
.ld-key.wide{min-width:58px;font-size:14px}
.ld-key.g{background:var(--emerald);border-color:var(--emerald);color:#fff}
.ld-key.y{background:var(--canary);border-color:var(--canary)}
.ld-key.x{background:#C9CBD1;border-color:#C9CBD1}
.ld-key:active{transform:scale(.95)}
/* phones: the keyboard stays pinned to the bottom of the screen while the grid scrolls */
@media (max-width:560px){.ld-keys{position:sticky;bottom:0;z-index:2;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -8px 12px -8px rgba(16,24,40,.12)}.ld-key{min-width:0;flex:1;height:44px;font-size:15px;padding:0 2px}.ld-key.wide{flex:1.6;min-width:0;font-size:12px}.ld-keys{width:100%}.ld-krow{gap:4px}}

/* mole: 3x3 구멍, 두더지가 낱말 팻말을 들고 올라와요 */
.ml{display:grid;gap:12px;max-width:900px;margin:0 auto;justify-items:center}
.ml-wrap{position:relative;width:100%}
.ml-field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;background:var(--lime-lt);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.ml-hole{position:relative;aspect-ratio:1.45;overflow:hidden;border:0;padding:0;background:transparent;border-radius:14px;touch-action:manipulation}
.ml-hole::before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:26%;background:#3B2A22;border-radius:50%}
.ml-hole::after{content:"";position:absolute;left:2%;right:2%;bottom:-8%;height:20%;background:var(--lime);border-radius:50% 50% 0 0 / 100% 100% 0 0;z-index:2}
.ml-mole{position:absolute;left:20%;right:20%;bottom:9%;height:80%;background:var(--mole);border:2px solid var(--royal-dk);border-radius:50% 50% 16% 16% / 58% 58% 16% 16%;
  transform:translateY(110%);transition:transform .16s ease-out}
.ml-hole.up .ml-mole{transform:none}
.ml-face{position:absolute;inset:0 0 auto 0;height:55%;background:radial-gradient(circle at 34% 40%,var(--ink) 0 3.5px,transparent 4.5px),radial-gradient(circle at 66% 40%,var(--ink) 0 3.5px,transparent 4.5px),radial-gradient(ellipse at 50% 70%,var(--melon) 0 7px,transparent 8px)}
.ml-sign{position:absolute;left:-22%;right:-22%;bottom:16%;padding:2px 4px;background:var(--shell);border:1.5px solid var(--royal-dk);border-radius:8px;
  font-weight:700;font-size:clamp(13px,1.9vw,20px);line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden}
.ml-hole.hit .ml-sign{background:var(--emerald-lt)}
.ml-hole.hit .ml-face{background:radial-gradient(circle at 34% 40%,var(--ink) 0 1.5px,transparent 2.5px),radial-gradient(circle at 66% 40%,var(--ink) 0 1.5px,transparent 2.5px),radial-gradient(ellipse at 50% 70%,var(--melon) 0 7px,transparent 8px)}
.ml-hole.wrong .ml-sign{background:var(--melon-lt)}
.ml-hole.wrong .ml-mole{animation:shake .35s}
.ml-hole .k{position:absolute;top:4px;left:6px;z-index:3;font-family:var(--font-pixel);font-size:12px;background:var(--shell);border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:16px}
.ml-wrap .gain{top:-8px;left:50%;right:auto;translate:-50% 0;white-space:nowrap;z-index:4}

/* teacher */
.teach{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow-sm);padding:18px;display:grid;gap:12px;min-width:0}
.panel h3{font-size:21px;color:var(--royal-dk)}
.panel p.hint{margin:0;color:var(--ink-soft);font-weight:300;font-size:15px}
label.lbl{font-size:15px;color:var(--ink-soft)}
.unit-bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}
.unit-bar>div{display:grid;gap:4px;min-width:0}
@media (max-width:560px){.unit-bar{grid-template-columns:1fr 1fr}.unit-bar>div{grid-column:1 / -1}}
select.tx{font-weight:500;min-height:44px;cursor:pointer}
input.tx,textarea.tx,select.tx{width:100%;font:inherit;font-weight:300;font-size:16px;color:var(--ink);background:var(--bg);border:2.5px solid var(--line);border-radius:12px;padding:9px 12px}
input.tx::placeholder,textarea.tx::placeholder{color:var(--ink-soft)}
input.tx:focus,textarea.tx:focus,select.tx:focus{border-color:var(--royal);outline:none;background:var(--shell)}
textarea.tx{min-height:120px;resize:vertical}
.wrows{display:grid;gap:8px;max-height:52vh;overflow:auto;padding:2px 4px 2px 2px}
.wrow,.colhead{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.colhead{font-size:14px;color:var(--ink-soft)}
.wrow .n{font-family:var(--font-pixel);color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.wrow button{display:grid;place-items:center;width:44px;height:44px;border:0;background:none;color:var(--bad);border-radius:10px}
.wrow button:hover{background:var(--melon-lt)}
.fmt{margin:0;background:var(--lcd);color:var(--lcd-ink);font-family:var(--font-pixel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.6;overflow-x:auto;white-space:pre}
#filePanel.drop{outline:4px dashed var(--royal);outline-offset:4px}
#filePreview{display:grid;gap:10px}
#filePreview p{margin:0;font-weight:300}
#filePreview b{font-weight:700}
#filePreview .strip span{border-color:var(--line);background:var(--bg)}
label.btn{cursor:pointer}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--shell);border:1px solid var(--line);border-radius:var(--r-panel);padding:12px 16px;box-shadow:var(--shadow)}
.savebar p{margin:0;flex:1 1 240px;min-width:0;font-weight:300}
.msg-bad{color:var(--bad)} .msg-good{color:var(--good)}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(28,47,95,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--shell);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px 24px;max-width:400px;width:100%;
  text-align:center;display:grid;gap:12px;justify-items:center;animation:bump .4s}
.modal h3{font-size:34px;color:var(--royal-dk)}
.modal p{margin:0;color:var(--ink-soft);font-weight:300}
.modal .stars .ico{width:52px;height:52px}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--royal-dk);color:var(--shell);
  padding:12px 18px;border-radius:var(--r-ctl);z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--drop)}

@keyframes bump{0%{transform:scale(.88)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.mcard.open.matched{animation:none}
@keyframes shake{0%,100%{translate:0}25%{translate:-7px}75%{translate:7px}}
@keyframes pulse{50%{background:var(--canary);transform:translateY(-4px)}}
@keyframes popped{to{scale:1.5;opacity:0}}

@media (max-width:900px){
  .games{grid-template-columns:repeat(2,minmax(0,1fr))}

  .balloon.xlong{font-size:11px}
  .lcd{padding:18px 18px 20px}

function cleanWords(a){return(Array.isArray(a)?a:[]).map(function(x){return{w:String((x&&x.w)||'').trim().slice(0,40),m:String((x&&x.m)||'').trim().slice(0,40)}}).filter(function(x){return x.w&&x.m})}

/* book = everything the teacher saved, split into units; an old single-list deck becomes one unnamed unit */
function clean(d){
  d=d||{};
  var units=Array.isArray(d.units)?d.units:[{name:'',words:d.words,sentences:d.sentences}];
  units=units.map(function(u){return{name:String((u&&u.name)||'').trim().slice(0,60),words:cleanWords(u&&u.words),sentences:cleanSents(u&&u.sentences)}})
    .filter(function(u){return u.words.length||u.sentences.length});
  if(!units.length)units=[{name:'',words:[],sentences:[]}];
  return{title:String(d.title||'').trim().slice(0,40)||'우리 반 낱말',sample:!!d.sample,units:units};
}
/* "Lesson 3 Don't Sit Here" -> number "3", title "Don't Sit Here" */
function unitParts(u,i){
  var m=/^(?:lesson|unit|단원)\s*(\d+)\s*[.:)\-]?\s*(.*)$/i.exec(u.name);
  return{num:m?m[1]:String(i+1),title:(m&&m[2])||u.name||(i+1)+'단원'};
}

  var raw=Array.isArray(d.sets)?d.sets:[Object.assign({id:'g4'},d)],byId={},ids=SETS.map(function(s){return s.id});
  raw.forEach(function(s){if(s&&s.id){byId[s.id]=s;if(ids.indexOf(s.id)<0)ids.push(s.id)}});
  return{sets:ids.map(function(id){
    var meta=SETS.filter(function(s){return s.id===id})[0]||{},s=byId[id]||{},c=clean(s),g=/(\d)학년/.exec(meta.name||s.name||'');
    return{id:id,name:String(s.name||meta.name||id).trim().slice(0,40),title:s.title?c.title:(g?g[1]+'학년 영어 낱말 복습':c.title),sample:c.sample,units:c.units};

function allUnits(){return book.units.map(function(_,i){return i})}
/* deck = what the games play with: every selected unit merged together */
function applySel(arr){
  var n=book.units.length,seen={};
  arr=(Array.isArray(arr)?arr:[]).map(Number).filter(function(i){if(i>=0&&i<n&&!seen[i]){seen[i]=1;return true}return false}).sort(function(a,b){return a-b});
  if(n===1)arr=[0];
  sel=arr;store.set('nm-units:'+book.id,arr);
  var us=arr.map(function(i){return book.units[i]});
  deck={title:book.title,sample:book.sample,units:us,
    words:[].concat.apply([],us.map(function(u){return u.words})),sentences:[].concat.apply([],us.map(function(u){return u.sentences}))};
}
/* open one textbook; each keeps its own unit selection on this device */
function useSet(id){
  var s=lib.sets.filter(function(x){return x.id===id})[0];if(!s)return false;
  book=s;store.set('nm-set',id);
  var saved=store.get('nm-units:'+id,null);applySel(saved===null?allUnits():saved);return true;
}
function selTag(){
  if(sel.length===book.units.length)return'전체';
  if(sel.length===1)return unitParts(book.units[sel[0]],sel[0]).num+'단원';
  return sel.length+'개 단원';
}

function spatialNav(root,e){
  var dirs={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]},d=dirs[e.key];if(!d)return false;
  var items=[].slice.call(root.querySelectorAll('.nav:not([disabled])'));if(!items.length)return false;
  var cur=document.activeElement;
  if(items.indexOf(cur)<0){items[0].focus();return true}
  var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bd=1e9;
  items.forEach(function(el){
    if(el===cur)return;var b=el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;
    var main=dx*d[0]+dy*d[1];if(main<4)return;
    var cross=Math.abs(dx*d[1]+dy*d[0]),score=main+cross*2.2;if(score<bd){bd=score;best=el}
  });
  if(best)best.focus();return true;
}
function keepFocus(stage,render){
  var a=document.activeElement,had=a&&stage.contains(a),key=had?a.getAttribute('data-key'):null;
  render();
  if(!had)return;
  var el=key&&stage.querySelector('[data-key="'+key+'"]:not([disabled])');
  if(!el)el=stage.querySelector('.nav:not([disabled])');
  if(el)el.focus({preventScroll:true});
}

/* shrink text until it fits its tile: measured, because glyph widths vary too much to guess */
/* widthOnly: for balloons, whose hanging string always pokes out below */
function fit(el,box,widthOnly){
  el.style.fontSize='';el.style.wordBreak='';box=box||el;
  var fs=parseFloat(getComputedStyle(el).fontSize),n=0;
  function over(){return el.scrollWidth>el.clientWidth+.5||box.scrollWidth>box.clientWidth+.5||(!widthOnly&&box.scrollHeight>box.clientHeight+.5)}
  while(n++<16&&fs>9&&over()){fs-=1;el.style.fontSize=fs+'px'}
  /* last resort on very narrow screens: let a long word wrap onto two lines */
  if(el.scrollWidth>el.clientWidth+.5||box.scrollWidth>box.clientWidth+.5){el.style.wordBreak='break-all';fs=Math.min(fs+2,13);el.style.fontSize=fs+'px';n=0;while(n++<10&&fs>8&&over()){fs-=1;el.style.fontSize=fs+'px'}}
}
function fitAll(root,sel,boxSel){[].forEach.call(root.querySelectorAll(sel),function(el){fit(el,boxSel?el.closest(boxSel):el)})}
/* merge tiles: when even the smallest text still overflows, drop the small 낱말/뜻 label to make room */
function fitMerge(root){fitAll(root,'.mg-word b','.mg-cell');[].forEach.call(root.querySelectorAll('.mg-cell'),function(c){c.classList.remove('tight');if(c.scrollHeight>c.clientHeight+.5){c.classList.add('tight');var b=c.querySelector('.mg-word b');if(b)fit(b,c)}})}

/* Hangul glyphs are wider than Latin ones, so weigh them more when picking a starting size */
function textSize(s){var w=s.length+(s.match(/[가-힣]/g)||[]).length*.65;return w>8?'xlong':w>5.2?'long':''}
/* words whose spelling and meaning both appear once, so a match never has two right answers */
function uniqueWords(list){var sw={},sm={};return shuffle(list.slice()).filter(function(w){if(sw[w.w]||sm[w.m])return false;sw[w.w]=sm[w.m]=1;return true})}
/* snake spells plain words only: no spaces, apostrophes or hyphens */
function snakeWords(){var seen={};return deck.words.filter(function(w){var k=w.w.toLowerCase();if(!/^[a-z]{2,8}$/.test(k)||seen[k])return false;seen[k]=1;return true})}

function ladderWords(){return snakeWords().filter(function(w){return w.w.length>=3&&w.w.length<=7})}
/* sentences with a word that can be blanked out: a whole token of two or more letters, punctuation kept outside the blank */
function blankList(){
  var out=[];
  deck.sentences.forEach(function(s){
    var toks=s.split(' '),cands=[];
    toks.forEach(function(t,i){var m=/^([^A-Za-z]*)([A-Za-z](?:[A-Za-z']*[A-Za-z])?)([^A-Za-z]*)$/.exec(t);if(m&&m[2].length>=2)cands.push({i:i,pre:m[1],core:m[2],post:m[3]})});

  var cards=shuffle([].concat.apply([],ws.map(function(w,i){return[{id:i,k:'w',t:w.w},{id:i,k:'m',t:w.m}]})));

/* 2. shisen-sho: 10x8 with rocks (6x10 on a phone); rocks block every path and never go away */
function gShisen(stage,setStats){
  var narrow=innerWidth<600,C=narrow?6:10,R=narrow?10:8,ROCKS=narrow?6:8,H=R+2,W=C+2,asp=narrow?1:1.25;
  var inner=[],r,c;for(r=1;r<=R;r++)for(c=1;c<=C;c++)inner.push(r*W+c);
  shuffle(inner);
  var rocks=inner.slice(0,ROCKS),spots=inner.slice(ROCKS),P2=spots.length/2;
  var list=[];while(list.length<P2)list=list.concat(shuffle(deck.words.slice()));list=list.slice(0,P2);
  var tiles=shuffle(wordPairs(list)),board=new Array(H*W).fill(null);
  rocks.forEach(function(i){board[i]={k:'x'}});
  spots.forEach(function(i,j){board[i]=tiles[j]});
  var sel=-1,left=P2,hints=3,hintsUsed=0,start=Date.now(),busy=false,timers=[];
  var tick=setInterval(upd,1000);
  function time(){var s=Math.floor((Date.now()-start)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function upd(){setStats('남은 짝 '+left+' · '+time())}
  function isTile(t){return t&&t.k!=='x'}
  function isPair(x,y){return isTile(x)&&isTile(y)&&x.id===y.id&&x.k!==y.k}
  /* board height = screen minus header; each row is a tile plus 8px of margin, tiles are asp times wider than tall */
  var maxW=narrow?'':'max-width:min(900px,calc(((100dvh - 278px) / '+R+' - 8px) * '+(asp*C)+' + '+(C*8+38)+'px));';
  function draw(){keepFocus(stage,function(){
    var cells='';
    for(var i=0;i<H*W;i++){
      var rr=Math.floor(i/W),cc=i%W,edge=rr===0||cc===0||rr===H-1||cc===W-1,t=board[i];
      if(edge)cells+='<span class="ss-cell" data-cell="'+i+'"></span>';
      else if(!t)cells+='<span class="ss-cell in" data-cell="'+i+'"></span>';
      else if(t.k==='x')cells+='<span class="ss-cell in ss-rock" data-cell="'+i+'" aria-hidden="true"></span>';
      else cells+='<button class="ss-cell in ss-tile nav '+t.k+(i===sel?' sel':'')+'" data-cell="'+i+'" data-i="'+i+'" data-key="t'+i+'" aria-pressed="'+(i===sel)+'">'+esc(t.t)+'</button>';
    }
    stage.innerHTML='<div class="ss-layout"><div class="ss-wrap" style="'+maxW+'"><div class="ss-board" style="--cols:'+C+';--rows:'+R+';--asp:'+asp+'">'+cells+'</div><svg class="ss-line" aria-hidden="true"><polyline class="under" points=""/><polyline class="over" points=""/></svg></div>'+
      '<div class="tools ss-tools"><button class="btn" data-ss="hint"'+(hints?'':' disabled')+'>'+icon('bulb')+'힌트 '+hints+'번</button><button class="btn" data-ss="shuffle">'+icon('shuffle')+'패 섞기</button></div></div>';
  });fitAll(stage,'.ss-tile');upd()}
  function findPath(a,b){
    var D=[[-1,0],[0,1],[1,0],[0,-1]],N=H*W*4,dist=new Int8Array(N).fill(9),prev=new Int32Array(N).fill(-1);
    var ar=Math.floor(a/W),acc=a%W,buckets=[[],[],[]];
    function ok(r,c){return r>=0&&r<H&&c>=0&&c<W&&(board[r*W+c]===null||r*W+c===b)}
    for(var d=0;d<4;d++){var nr=ar+D[d][0],nc=acc+D[d][1];if(ok(nr,nc)){var s0=(nr*W+nc)*4+d;dist[s0]=0;prev[s0]=-2;buckets[0].push(s0)}}
    for(var t=0;t<3;t++){
      var q=buckets[t];
      for(var k=0;k<q.length;k++){
        var s=q[k];if(dist[s]!==t)continue;

  function anyPair(){

    for(var x=0;x<idx.length;x++)for(var y=x+1;y<idx.length;y++)if(isPair(board[idx[x]],board[idx[y]])&&findPath(idx[x],idx[y]))return[idx[x],idx[y]];
    return null;

  /* re-deal the remaining tiles over every free cell, not just their old spots:
     with few tiles left, swapping spots alone can leave a pair the rocks keep apart forever */

  }
  function drawLine(path){
    var wrap=stage.querySelector('.ss-wrap'),box=wrap.getBoundingClientRect(),pts=[];
    path.forEach(function(i,j){
      if(j>0&&j<path.length-1){var a=path[j-1],b=path[j+1];if((a%W===i%W&&b%W===i%W)||(Math.floor(a/W)===Math.floor(i/W)&&Math.floor(b/W)===Math.floor(i/W)))return}
      var rc=stage.querySelector('[data-cell="'+i+'"]').getBoundingClientRect();
      pts.push((rc.left+rc.width/2-box.left).toFixed(1)+','+(rc.top+rc.height/2-box.top).toFixed(1));
    });
    stage.querySelectorAll('.ss-line polyline').forEach(function(p){p.setAttribute('points',pts.join(' '))});
  }
  if(!anyPair())reshuffle();else draw();
  keyHandler=function(e){return spatialNav(stage,e)};
  stage.onclick=function(e){
    var tool=e.target.closest('[data-ss]');
    if(tool){
      if(busy)return;
      if(tool.dataset.ss==='shuffle'){reshuffle();sfx('shuffle');return}
      if(!hints)return;
      var p=anyPair();if(!p)return;
      hints--;hintsUsed++;sel=-1;draw();sfx('hint');
      p.forEach(function(i){stage.querySelector('[data-i="'+i+'"]').classList.add('hint')});return;
    }
    var b=e.target.closest('.ss-tile');if(!b||busy)return;
    var i=+b.dataset.i;
    if(sel===-1){sel=i;b.classList.add('sel');b.setAttribute('aria-pressed','true');sfx('select');return}
    if(sel===i){sel=-1;b.classList.remove('sel');b.setAttribute('aria-pressed','false');return}
    var prevEl=stage.querySelector('[data-i="'+sel+'"]');
    if(!isPair(board[sel],board[i])){
      sfx('bad');prevEl.classList.remove('sel');prevEl.setAttribute('aria-pressed','false');sel=i;b.classList.add('sel');b.setAttribute('aria-pressed','true');return;
    }
    var path=findPath(sel,i);
    if(!path){sfx('bad');toast('길이 막혔어요. 다른 짝부터 찾아보세요!');prevEl.classList.remove('sel');sel=-1;return}
    busy=true;b.classList.add('sel');drawLine(path);sfx('ok');
    var a=sel;sel=-1;
    timers.push(setTimeout(function(){prevEl.classList.add('vanish');b.classList.add('vanish')},180));
    timers.push(setTimeout(function(){
      board[a]=null;board[i]=null;left--;busy=false;draw();
      if(left===0){
        clearInterval(tick);
        var secs=Math.floor((Date.now()-start)/1000),st=3;if(secs>600)st--;if(hintsUsed>1)st--;
        finish('shisen',Math.max(1,st),time()+' 만에 판을 모두 비웠어요. 힌트는 '+hintsUsed+'번 썼어요.');
      }else if(!anyPair()){toast('이을 수 있는 짝이 없어서 패를 섞었어요');reshuffle()}
    },480));
  };
  cleanup=function(){clearInterval(tick);timers.forEach(clearTimeout)};
}

/* 3. merge: 16 levels. pair -> Lv1; any two stars -> higher +1; same level -> +2 */
var MAXLV=16;

var SHAPE=[
 '<path d="M12 2.8l2.8 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17l-5.7 3.1 1.2-6.3-4.6-4.4 6.3-.8z"/>',
 '<path d="M15 3a9 9 0 1 0 6.5 12.5A7.5 7.5 0 0 1 15 3z"/>',
 '<circle cx="12" cy="12" r="4.8"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1" fill="none"/>',
 '<path d="M12 20.5s-8-4.9-8-10.6A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.9c0 5.7-8 10.6-8 10.6z"/>',
 '<path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M9.5 4L12 9l2.5-5M12 9v11" fill="none"/>',
 '<circle cx="12" cy="6.3" r="3.4"/><circle cx="17.4" cy="10.2" r="3.4"/><circle cx="15.3" cy="16.6" r="3.4"/><circle cx="8.7" cy="16.6" r="3.4"/><circle cx="6.6" cy="10.2" r="3.4"/><circle cx="12" cy="12" r="2.6"/>',
 '<circle cx="12" cy="12" r="6"/><ellipse cx="12" cy="12" rx="10.5" ry="3.4" fill="none" transform="rotate(-20 12 12)"/>',
 '<path d="M3 19L5 7l4.5 5L12 4.5 14.5 12 19 7l2 12z"/>'];
function lvIcon(lv){return'<svg viewBox="0 0 24 24" aria-hidden="true">'+SHAPE[(lv-1)%8]+'</svg>'}
function lvClass(lv){return'lv'+((lv-1)%8+1)+(lv>8?' gold':'')}
function gMerge(stage,setStats){
  var N=6,cells=new Array(N*N).fill(null),timers=[];
  var ws=pick(deck.words,Math.min(8,deck.words.length)).map(function(w,i){return{w:w.w,m:w.m,id:i}});
  var sel=-1,score=0,best=0,over=false;
  function isPair(a,b){return a&&b&&a.k!=='s'&&b.k!=='s'&&a.id===b.id&&a.k!==b.k}
  function empties(){var e=[];cells.forEach(function(t,i){if(!t)e.push(i)});return e}
  function spawn(){
    var e=empties();if(!e.length)return -1;
    var loose=cells.filter(function(t){return t&&t.k!=='s'}),tile;
    if(loose.length&&Math.random()<.6){var t=rnd(loose),w=ws[t.id];tile=t.k==='w'?{k:'m',id:t.id,t:w.m}:{k:'w',id:t.id,t:w.w}}
    else{var w2=rnd(ws);tile=Math.random()<.5?{k:'w',id:w2.id,t:w2.w}:{k:'m',id:w2.id,t:w2.m}}
    var at=rnd(e);cells[at]=tile;return at;
  }
  pick(ws,4).forEach(function(w){var e=empties();cells[rnd(e)]={k:'w',id:w.id,t:w.w};e=empties();cells[rnd(e)]={k:'m',id:w.id,t:w.m}});
  function canMerge(){
    var loose=cells.filter(function(t){return t&&t.k!=='s'});
    for(var x=0;x<loose.length;x++)for(var y=x+1;y<loose.length;y++)if(isPair(loose[x],loose[y]))return true;
    return cells.filter(function(t){return t&&t.k==='s'&&t.lv<MAXLV}).length>=2;
  }
  function tileHTML(t){
    if(t.k==='s')return'<span class="mg-star '+lvClass(t.lv)+'">'+lvIcon(t.lv)+'<small>'+t.lv+'</small></span>';
    return'<span class="mg-word '+t.k+'"><small>'+(t.k==='w'?'낱말':'뜻')+'</small><b class="'+textSize(t.t)+'">'+esc(t.t)+'</b></span>';
  }
  function ladder(){
    var h='';for(var l=1;l<=MAXLV;l++)h+='<i class="'+lvClass(l)+(best>=l?' got':'')+'" title="'+l+'단계 '+LV[l]+'">'+lvIcon(l)+'</i>';
    return h;
  }
  function draw(fx){keepFocus(stage,function(){
    var full=!empties().length;
    stage.innerHTML='<div class="mg"><div class="mg-board">'+cells.map(function(t,i){
      var cls='mg-cell nav'+(t?' has':'')+(i===sel?' sel':'')+(fx&&fx.i.indexOf(i)>=0?' '+fx.c:'');
      var label=t?(t.k==='s'?t.lv+'단계 '+LV[t.lv]:(t.k==='w'?'낱말 ':'뜻 ')+t.t):'빈 칸';
      return'<button class="'+cls+'" data-i="'+i+'" data-key="c'+i+'" aria-label="'+esc(label)+'">'+(t?tileHTML(t):'')+'</button>';
    }).join('')+'</div><div class="mg-side"><button class="btn primary nav" data-mg="spawn" data-key="spawn"'+(full||over?' disabled':'')+'>'+icon('plus')+'낱말 뽑기<span class="kbd hide-sm">N</span></button>'+
    '<div class="goal"><h3>16단계 '+LV[MAXLV]+'까지!</h3><div class="ladder" aria-label="지금 최고 '+best+'단계">'+ladder()+'</div>'+
    '<ul><li>낱말 + 뜻 = 1단계</li><li>별 + 별 = 높은 쪽 +1</li><li>같은 단계끼리 = <b>+2</b></li></ul></div></div></div>';
  });fitMerge(stage);setStats('점수 '+score+' · 최고 '+(best?best+'단계':'없음'))}
  function checkEnd(){

    if(!empties().length&&!canMerge()){over=true;draw();timers.push(setTimeout(function(){finish('merge',best>=12?2:1,'칸이 꽉 찼어요. 최고 '+(best?best+'단계':'없음')+', 점수 '+score+'점.')},500))}
  }

  draw();
  keyHandler=function(e){if((e.key==='n'||e.key==='N')&&!over){doSpawn();return true}return spatialNav(stage,e)};
  stage.onclick=function(e){
    if(over)return;

    var b=e.target.closest('.mg-cell');if(!b)return;

    if(sel===i){sel=-1;draw();return}
    var s=cells[sel];

    if(isPair(s,t)){cells[i]={k:'s',lv:1};cells[sel]=null;score+=10;best=Math.max(best,1);sel=-1;sfx('merge');draw({i:[i],c:'pop'});checkEnd();return}
    if(s.k==='s'&&t.k==='s'&&(s.lv<MAXLV||t.lv<MAXLV)){
      var same=s.lv===t.lv,lv=Math.min(MAXLV,Math.max(s.lv,t.lv)+(same?2:1));

      var up=lv>best;best=Math.max(best,lv);sel=-1;sfx(lv===8||lv===MAXLV?'crown':'merge');draw({i:[i],c:'pop'});
      if(up&&(lv===8||lv===MAXLV))toast(lv+'단계 '+LV[lv]+' 완성!');else if(same)toast('같은 단계 보너스! 2단계 올라갔어요');
      checkEnd();return}

  };
  cleanup=function(){timers.forEach(clearTimeout)};
}

/* 4. sentence puzzle: up to 10 sentences, points for each one solved */
function gSentence(stage,setStats){
  var rounds=pick(deck.sentences,Math.min(10,deck.sentences.length)),ri=0,mistakes=0,roundMiss=0,streak=0,score=0,tokens,order,placed,lock=false,timers=[];
  function setup(){
    tokens=rounds[ri].split(' ');order=tokens.map(function(_,i){return i});
    for(var g=0;g<30;g++){shuffle(order);if(order.map(function(i){return tokens[i]}).join(' ')!==tokens.join(' '))break}
    placed=[];roundMiss=0;draw();
  }
  function draw(state,gain){keepFocus(stage,function(){
    stage.innerHTML='<div class="sp"><p class="sp-count">'+(ri+1)+' / '+rounds.length+'</p>'+
      '<div class="sp-line '+(state||'')+'">'+(placed.length?placed.map(function(ti,k){return'<button class="chip placed nav" data-k="'+k+'" data-key="p'+ti+'">'+esc(tokens[ti])+'</button>'}).join(''):'<span class="sp-ph">아래 낱말 조각을 순서대로 골라 보세요</span>')+
      (gain?'<span class="gain" aria-hidden="true">+'+gain+'</span>':'')+'</div>'+
      '<div class="sp-pool">'+order.map(function(ti){return placed.indexOf(ti)>=0?'<span class="chip ghost">'+esc(tokens[ti])+'</span>':'<button class="chip nav" data-t="'+ti+'" data-key="t'+ti+'">'+esc(tokens[ti])+'</button>'}).join('')+'</div>'+
      '<div class="tools"><button class="btn" data-sp="reset"'+(placed.length?'':' disabled')+'>'+icon('undo')+'처음부터</button></div></div>';
  });setStats('문장 '+(ri+1)+'/'+rounds.length+' · 점수 '+score)}
  setup();
  keyHandler=function(e){
    if(e.key==='Backspace'&&!lock&&placed.length){placed.pop();sfx('tap');draw();return true}
    return spatialNav(stage,e);
  };
  stage.onclick=function(e){
    if(lock)return;
    if(e.target.closest('[data-sp]')){placed=[];draw();return}
    var p=e.target.closest('.chip.placed');
    if(p){placed.splice(+p.dataset.k,1);sfx('tap');draw();return}
    var c=e.target.closest('.chip[data-t]');if(!c)return;
    placed.push(+c.dataset.t);sfx('place');
    if(placed.length<tokens.length){draw();return}
    var made=placed.map(function(i){return tokens[i]}).join(' ');
    if(made===tokens.join(' ')){
      /* 100 per sentence, minus 20 per mistake (at least 40), plus 20 for every perfect one in a row */
      streak=roundMiss?0:streak+1;
      var gain=Math.max(40,100-roundMiss*20)+(streak>1?(streak-1)*20:0);score+=gain;
      lock=true;sfx('ok');draw('good',gain);
      if(streak>1)toast(streak+'문장 연속 완벽! 보너스 +'+(streak-1)*20);
      timers.push(setTimeout(function(){lock=false;ri++;
        if(ri<rounds.length)setup();
        else{var maxS=rounds.length*100;finish('sentence',score>=maxS*1.1?3:score>=maxS*.7?2:1,rounds.length+'개 문장을 완성했어요. 점수 '+score+'점, 실수 '+mistakes+'번.')}
      },1100));
    }else{mistakes++;roundMiss++;streak=0;sfx('bad');draw('bad');toast('순서가 달라요. 조각을 골라 고쳐 보세요')}
  };
  cleanup=function(){timers.forEach(clearTimeout)};
}

/* 5. balloon pop: 6 balloons a question (4 on a phone), faster every question */
function gBalloon(stage,setStats){
  var TOTAL=Math.min(12,Math.max(6,deck.words.length)),q=0,correct=0,hearts=3,balloons=[],target=null,raf=0,last=0,busy=true,alive=true,started=false,timers=[];
  stage.innerHTML='<div class="bl"><div class="bl-q"><small>이 뜻의 낱말은?</small><b id="blQ">?</b></div><div class="bl-sky" id="sky">'+
    '<div class="bl-start"><p>빠르게 떠오르는 풍선 문제가 '+TOTAL+'번 나와요. 하트 3개가 다 없어지기 전에 맞혀 보세요!</p><button class="btn primary" id="blGo">'+icon('play','fill')+'시작하기<span class="kbd hide-sm">Enter</span></button></div></div></div>';
  var sky=stage.querySelector('#sky');
  function upd(){var h='';for(var i=0;i<3;i++)h+=icon('heart',i<hearts?'':'off');setStats('<span class="hearts" aria-label="하트 '+hearts+'개">'+h+'</span> '+correct+'/'+TOTAL)}
  upd();
  function end(){
    alive=false;cancelAnimationFrame(raf);
    var st=correct>=TOTAL-1?3:correct>=Math.ceil(TOTAL*.6)?2:1;
    finish('balloon',st,TOTAL+'문제 중 '+correct+'개를 맞혔어요.');
  }
  function next(){
    if(!alive)return;
    if(hearts<=0||q>=TOTAL){end();return}
    q++;sky.innerHTML='';
    var lanesN=sky.clientWidth>=640?6:4;
    var pool=deck.words.filter(function(w){return!target||w.w!==target.w});
    target=rnd(pool.length?pool:deck.words);
    var others=pick(deck.words.filter(function(w){return w.w!==target.w&&w.m!==target.m}),lanesN-1);
    var opts=shuffle([target].concat(others)),lanes=shuffle(opts.map(function(_,i){return i}));
    var Hs=sky.clientHeight,speed=(88+q*12)*(reduceMotion?.7:1);
    balloons=opts.map(function(w,i){
      var el=document.createElement('button');
      el.className='balloon c'+(i%4)+' '+textSize(w.w);
      el.innerHTML=esc(w.w)+'<span class="k" aria-hidden="true">'+(lanes[i]+1)+'</span>';
      el.setAttribute('aria-label',w.w+' (숫자 '+(lanes[i]+1)+')');
      el.style.left='calc('+((lanes[i]+.5)/opts.length*100)+'% - var(--bw) / 2)';
      var b={el:el,w:w,lane:lanes[i],y:Hs+10+Math.random()*Hs*.7,v:speed*(.8+Math.random()*.45),dead:false};
      el.style.transform='translateY('+b.y+'px)';
      el.onclick=function(){hit(b)};sky.appendChild(el);fit(el,el,true);return b;
    });
    document.getElementById('blQ').textContent=target.m;busy=false;upd();
  }
  function hit(b){
    if(busy||b.dead)return;
    b.dead=true;
    if(b.w===target){busy=true;correct++;b.el.classList.add('popped');sfx('pop');upd();timers.push(setTimeout(next,500))}
    else{hearts--;b.el.classList.add('wrong');sfx('bad');upd();if(hearts<=0){busy=true;timers.push(setTimeout(end,700))}}
  }
  function loop(t){
    if(!alive)return;
    var dt=Math.min(.05,(t-last)/1000);last=t;
    balloons.forEach(function(b){
      if(b.dead&&b.w===target)return;
      b.y-=b.v*dt;b.el.style.transform='translateY('+b.y+'px)';
      if(b.w===target&&!busy&&b.y<-b.el.offsetHeight-40){busy=true;hearts--;sfx('lose');toast('놓쳤어요! 정답은 '+target.w);upd();
        timers.push(setTimeout(hearts<=0?end:next,900))}
    });
    raf=requestAnimationFrame(loop);
  }
  function begin(){if(started)return;started=true;sfx('start');next();last=performance.now();raf=requestAnimationFrame(loop)}
  stage.querySelector('#blGo').onclick=begin;
  stage.querySelector('#blGo').focus({preventScroll:true});
  keyHandler=function(e){
    if(!started&&e.key==='Enter'){begin();return true}
    var d='123456'.indexOf(e.key);if(d<0)return false;
    balloons.forEach(function(b){if(b.lane===d)hit(b)});return true;
  };
  cleanup=function(){alive=false;cancelAnimationFrame(raf);timers.forEach(clearTimeout)};
}

/* 6. solitaire: Klondike-style columns, only the top card of each column face up.
   pick a card, then its partner, and both leave. Park cards in the pair slots or an empty column to dig.
   the deck deals one card at a time and can be gone through again and again */
function gSolitaire(stage,setStats){
  var narrow=innerWidth<600,COLS=narrow?5:6,SLOTS=COLS-2,timers=[];
  /* a meaning shared by two words would make two right answers, so keep words and meanings unique */
  var seenW={},seenM={},ws=[];

  var sx=0,sy=0;

  cv.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});

/* 8. word tetris: a falling word or meaning; land it on or beside its partner and both clear. a full row clears too */
function gTetris(stage,setStats){
  var narrow=innerWidth<600,C=narrow?4:5,R=narrow?9:8,ASP=narrow?1.5:1.8,GOAL=narrow?10:12;
  var ws=uniqueWords(deck.words).slice(0,10),uid=0;
  function tile(id,k){return{id:id,k:k,t:k==='w'?ws[id].w:ws[id].m,u:++uid}}
  function randTile(){return tile(Math.floor(Math.random()*ws.length),Math.random()<.5?'w':'m')}
  function partner(t){return tile(t.id,t.k==='w'?'m':'w')}
  function isPair(a,b){return a&&b&&a.id===b.id&&a.k!==b.k}
  var grid=[],r,c;for(r=0;r<R;r++){grid.push(new Array(C).fill(null))}
  /* two starting rows with no pair already touching */
  for(r=R-2;r<R;r++)for(c=0;c<C;c++){
    if(r===R-2&&Math.random()<.5)continue;
    for(var g=0;g<30;g++){var t=randTile();if(!isPair(t,grid[r][c-1])&&!(r+1<R&&isPair(t,grid[r+1][c])))break}
    grid[r][c]=t;
  }
  /* settle the top row so nothing floats */
  for(c=0;c<C;c++)if(!grid[R-1][c]&&grid[R-2][c]){grid[R-1][c]=grid[R-2][c];grid[R-2][c]=null}
  function exposed(){var a=[];for(var c=0;c<C;c++)for(var r=0;r<R;r++)if(grid[r][c]){a.push(grid[r][c]);break}return a}
  /* most blocks are the partner of a block you can reach, so every drop can be useful */
  function makeNext(){var ex=exposed();return ex.length&&Math.random()<.72?partner(rnd(ex)):randTile()}
  var fall=null,next=makeNext(),cleared=0,misses=0,alive=true,started=false,busy=false,acc=0,timers=[];
  var stepMs=function(){return Math.max(360,880-cleared*40)*(reduceMotion?1.3:1)};
  var boardStyle='aspect-ratio:'+(C*ASP).toFixed(2)+' / '+R+';--cols:'+C;
  var wrapStyle='max-width:min(760px,calc((100dvh - '+(narrow?280:290)+'px) * '+(C*ASP/R).toFixed(3)+'));';
  function landRow(c){for(var r=0;r<R;r++)if(grid[r][c])return r-1;return R-1}
  function pos(r,c){return'left:'+(c*100/C)+'%;top:'+(r*100/R)+'%;width:'+(100/C)+'%;height:'+(100/R)+'%'}
  function tileHTML(t,r,c,cls){return'<span class="tt-tile '+t.k+(cls||'')+'" style="'+pos(r,c)+'" aria-hidden="true"><b>'+esc(t.t)+'</b></span>'}
  function upd(){setStats('짝 '+cleared+'/'+GOAL)}
  function draw(marks){keepFocus(stage,function(){
    var h='';
    for(var r=0;r<R;r++)for(var c=0;c<C;c++)if(grid[r][c])h+=tileHTML(grid[r][c],r,c,marks&&marks[r+','+c]?' vanish':'');
    if(fall){var lr=landRow(fall.c);if(lr>fall.r)h+='<span class="tt-ghost" style="'+pos(lr,fall.c)+'" aria-hidden="true"></span>';h+=tileHTML(fall.t,fall.r,fall.c,' fall')}
    for(var cc=0;cc<C;cc++)h+='<button class="tt-col" data-col="'+cc+'" data-key="col'+cc+'" style="left:'+(cc*100/C)+'%;width:'+(100/C)+'%" aria-label="'+(cc+1)+'번째 줄로 떨어뜨리기"></button>';
    stage.querySelector('#ttBoard').innerHTML=h;
    stage.querySelector('#ttNext').innerHTML=tileHTML(next,0,0).replace(/style="[^"]*"/,'');
    stage.querySelector('#ttNow').textContent=fall?(fall.t.k==='w'?'낱말 ':'뜻 ')+fall.t.t+', '+(fall.c+1)+'번째 줄':'';
  });fitAll(stage,'.tt-tile b');upd()}
  stage.innerHTML='<div class="tt"><div class="tt-wrap" style="'+wrapStyle+'"><div class="tt-board" id="ttBoard" style="'+boardStyle+'"></div>'+
    '<div class="bl-start" id="ttStart"><p>떨어지는 블록을 짝 위나 옆에 놓아 없애요. 짝 '+GOAL+'개를 맞추면 이겨요!</p><button class="btn primary" id="ttGo">'+icon('play','fill')+'시작하기<span class="kbd hide-sm">Enter</span></button></div></div>'+
    '<div class="tt-side"><div class="tt-next"><small>다음 블록</small><div id="ttNext"></div></div><div class="tt-next"><small>떨어지는 블록</small><b id="ttNow" aria-live="polite" style="font-size:15px"></b></div>'+
    '<div class="tt-pad"><button class="btn" data-tt="left" aria-label="왼쪽으로">←</button><button class="btn" data-tt="drop" aria-label="바로 떨어뜨리기">↓</button><button class="btn" data-tt="right" aria-label="오른쪽으로">→</button></div></div></div>';
  function spawn(){
    if(!alive)return;
    var c=Math.floor(C/2);
    if(grid[0][c]){lose();return}
    fall={t:next,c:c,r:0};next=makeNext();acc=0;draw();
  }
  function move(dx){if(!fall||busy)return;var nc=fall.c+dx;if(nc<0||nc>=C||grid[fall.r][nc])return;fall.c=nc;sfx('tap');draw()}
  function down(){if(!fall||busy)return;if(fall.r+1<R&&!grid[fall.r+1][fall.c]){fall.r++;draw()}else land()}
  function drop(){if(!fall||busy)return;fall.r=landRow(fall.c);land()}
  function dropAt(c){
    if(!fall||busy)return;
    /* slide along the current row only while the way is clear */
    var step=c>fall.c?1:-1;while(fall.c!==c&&!grid[fall.r][fall.c+step])fall.c+=step;
    drop();
  }
  function land(){var f=fall;fall=null;grid[f.r][f.c]=f.t;sfx('place');resolve(1,f)}
  function resolve(chain,landed){
    var marks={},pairs=0,rows=0,shown=null;
    for(var r=0;r<R;r++)for(var c=0;c<C;c++){
      var t=grid[r][c];if(!t)continue;
      [[0,1],[1,0]].forEach(function(d){var r2=r+d[0],c2=c+d[1];if(r2<R&&c2<C&&isPair(t,grid[r2][c2])&&!marks[r+','+c]&&!marks[r2+','+c2]){marks[r+','+c]=marks[r2+','+c2]=1;pairs++;shown=t}});
    }
    for(r=0;r<R;r++){if(grid[r].every(Boolean)){rows++;for(c=0;c<C;c++)marks[r+','+c]=1}}
    if(!pairs&&!rows){
      if(chain===1)misses++;
      busy=false;draw();
      if(cleared>=GOAL)win();else timers.push(setTimeout(spawn,150));
      return;
    }
    busy=true;draw(marks);sfx(chain>1||rows?'merge':'ok');
    if(shown){var w=shown.k==='w'?shown.t:ws[shown.id].w,g=document.createElement('span');g.className='gain';g.setAttribute('aria-hidden','true');
      g.textContent=(chain>1?'연쇄! ':'')+w+' = '+ws[shown.id].m;stage.querySelector('.tt-wrap').appendChild(g);timers.push(setTimeout(function(){g.remove()},1000))}
    if(rows)toast('한 줄을 다 채워서 지웠어요!');
    timers.push(setTimeout(function(){
      for(var k in marks){var p=k.split(',');grid[+p[0]][+p[1]]=null}
      cleared+=pairs;
      /* everything above falls down */
      for(var c=0;c<C;c++){var col=[];for(var r=R-1;r>=0;r--)if(grid[r][c])col.push(grid[r][c]);for(r=R-1;r>=0;r--)grid[r][c]=col[R-1-r]||null}
      draw();timers.push(setTimeout(function(){resolve(chain+1)},180));
    },280));
  }
  function stop(){alive=false;clearInterval(ticker);timers.forEach(clearTimeout)}
  function win(){stop();finish('tetris',misses<=6?3:misses<=14?2:1,'짝 '+cleared+'개를 맞췄어요. 짝 없이 놓은 블록은 '+misses+'개예요.')}
  function lose(){stop();sfx('lose');finish('tetris',1,'블록이 맨 위까지 쌓였어요. 짝 '+cleared+'개를 맞췄어요.')}
  var ticker=setInterval(function(){if(!started||busy||!fall)return;acc+=50;if(acc>=stepMs()){acc=0;down()}},50);
  function begin(){if(started)return;started=true;stage.querySelector('#ttStart').remove();sfx('start');playMode();spawn()}
  draw();
  stage.querySelector('#ttGo').onclick=begin;stage.querySelector('#ttGo').focus({preventScroll:true});
  stage.onclick=function(e){
    if(!started)return;
    var col=e.target.closest('[data-col]');if(col){dropAt(+col.dataset.col);return}
    var b=e.target.closest('[data-tt]');if(!b)return;
    if(b.dataset.tt==='left')move(-1);else if(b.dataset.tt==='right')move(1);else drop();
  };
  keyHandler=function(e){
    if(!started){if(e.key==='Enter'){begin();return true}return false}
    if(e.key==='ArrowLeft'){move(-1);return true}
    if(e.key==='ArrowRight'){move(1);return true}
    if(e.key==='ArrowDown'){down();return true}
    if(e.key===' '||e.key==='ArrowUp'){drop();return true}
    return false;
  };
  if(LOCAL)window.__nmGame={tetris:function(){return{grid:grid,fall:fall,busy:busy,C:C,R:R}}};
  cleanup=stop;
}

/* 9. word match-3: swap neighbours; three or more of the same word in a line (word or meaning, mixed) pop */
function gMatch(stage,setStats){
  var narrow=innerWidth<600,C=6,R=7,K=5,MOVES=20,ASP=narrow?1.15:1.5,uid=0;
  var ws=uniqueWords(deck.words).slice(0,K);K=ws.length;
  function tile(){var id=Math.floor(Math.random()*K),k=Math.random()<.5?'w':'m';return{id:id,k:k,t:k==='w'?ws[id].w:ws[id].m,u:++uid}}
  var b=new Array(R*C).fill(null),sel=-1,moves=MOVES,score=0,popped=0,hints=3,busy=false,timers=[],fresh={};
  function at(r,c){return r>=0&&r<R&&c>=0&&c<C?b[r*C+c]:null}
  function same(x,y){return x&&y&&x.id===y.id}
  /* every cell that sits in a line of three or more of the same word */
  function runs(){
    var m={},groups=[];
    function scan(len,get,idx){
      for(var line=0;line<len[0];line++){var s=0;
        for(var i=1;i<=len[1];i++){
          if(i<len[1]&&same(get(line,i),get(line,s)))continue;
          if(i-s>=3){var g=[];for(var j=s;j<i;j++){m[idx(line,j)]=1;g.push(idx(line,j))}groups.push(g)}
          s=i;
        }
      }
    }
    scan([R,C],function(r,c){return at(r,c)},function(r,c){return r*C+c});
    scan([C,R],function(c,r){return at(r,c)},function(c,r){return r*C+c});
    return{cells:Object.keys(m).map(Number),groups:groups};
  }
  function swap(i,j){var t=b[i];b[i]=b[j];b[j]=t}
  function findMove(){
    for(var i=0;i<R*C;i++){var r=Math.floor(i/C),c=i%C;
      var ns=[];if(c+1<C)ns.push(i+1);if(r+1<R)ns.push(i+C);
      for(var k=0;k<ns.length;k++){swap(i,ns[k]);var ok=runs().cells.length>0;swap(i,ns[k]);if(ok)return[i,ns[k]]}}
    return null;
  }
  function fillFresh(){for(var i=0;i<R*C;i++)if(!b[i]){for(var g=0;g<40;g++){b[i]=tile();if(!runs().cells.length)break}}}
  function reshuffle(){for(var g=0;g<50;g++){b.fill(null);fillFresh();if(findMove())break}}
  reshuffle();
  function adj(i,j){var dr=Math.abs(Math.floor(i/C)-Math.floor(j/C)),dc=Math.abs(i%C-j%C);return dr+dc===1}
  var wrapStyle=narrow?'':'max-width:min(760px,calc((100dvh - 290px) * '+(ASP*C/R).toFixed(3)+' + 20px));';
  function upd(){setStats('남은 이동 '+moves+' · 점수 '+score)}
  function draw(fx){fx=fx||{};keepFocus(stage,function(){
    stage.innerHTML='<div class="ss-layout"><div class="m3-wrap" style="'+wrapStyle+'"><div class="m3-board" style="--cols:'+C+';--asp:'+ASP+'">'+b.map(function(t,i){
      if(!t)return'<span class="m3-cell" aria-hidden="true" style="visibility:hidden"></span>';
      var cls='m3-cell nav '+t.k+(i===sel?' sel':'')+(fx.vanish&&fx.vanish.indexOf(i)>=0?' vanish':'')+(fx.shake&&fx.shake.indexOf(i)>=0?' shake':'')+(fresh[t.u]?' drop':'');
      return'<button class="'+cls+'" data-i="'+i+'" data-key="m'+i+'" aria-pressed="'+(i===sel)+'" aria-label="'+(t.k==='w'?'낱말 ':'뜻 ')+esc(t.t)+', '+(Math.floor(i/C)+1)+'행 '+(i%C+1)+'열"><b>'+esc(t.t)+'</b></button>';
    }).join('')+'</div></div>'+
    '<div class="tools ss-tools"><div class="m3-goal"><span>남은 이동</span><b>'+moves+'</b><span>점수</span><b>'+score+'</b></div><button class="btn" data-m3="hint"'+(hints&&!busy?'':' disabled')+'>'+icon('bulb')+'힌트 '+hints+'번</button></div></div>';
  });fresh={};fitAll(stage,'.m3-cell b','.m3-cell');upd()}
  function gain(text){var w=stage.querySelector('.m3-wrap');if(!w)return;var g=document.createElement('span');g.className='gain';g.setAttribute('aria-hidden','true');g.textContent=text;w.appendChild(g);timers.push(setTimeout(function(){g.remove()},1000))}
  function trySwap(i,j){
    busy=true;sel=-1;swap(i,j);
    if(!runs().cells.length){swap(i,j);sfx('bad');draw({shake:[i,j]});timers.push(setTimeout(function(){busy=false},300));return}
    moves--;sfx('place');resolve(1);
  }
  function resolve(combo){
    var r=runs();
    if(!r.cells.length){
      busy=false;
      if(moves<=0){draw();timers.push(setTimeout(end,400));return}
      if(!findMove()){toast('바꿀 수 있는 칸이 없어서 섞었어요');reshuffle();b.forEach(function(t){if(t)fresh[t.u]=1});sfx('shuffle')}
      draw();return;
    }
    var big=r.groups.reduce(function(m,g){return Math.max(m,g.length)},0),w=ws[b[r.groups[0][0]].id];
    score+=r.cells.length*10*combo+(big>=4?(big-3)*30:0);popped+=r.cells.length;
    sfx(combo>1?'merge':'ok');draw({vanish:r.cells});
    gain((combo>1?combo+'연쇄! ':'')+w.w+' = '+w.m);
    if(big>=5)toast(big+'개를 한 번에! 보너스');else if(big===4)toast('4개 연결! 보너스');
    timers.push(setTimeout(function(){
      r.cells.forEach(function(i){b[i]=null});

      for(var c=0;c<C;c++){
