    },280));
  }
  function end(){finish('match',score>=1500?3:score>=900?2:1,MOVES+'번 움직여 '+score+'점을 모았어요. 낱말 '+popped+'개를 터뜨렸어요.')}
  draw();
  var down=null,swiped=false;
  stage.addEventListener('pointerdown',function(e){var c=e.target.closest('.m3-cell[data-i]');down=c?{i:+c.dataset.i,x:e.clientX,y:e.clientY}:null;swiped=false});
  stage.addEventListener('pointerup',function(e){
    if(!down||busy)return;var dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    var r=Math.floor(down.i/C),c=down.i%C;
    if(Math.abs(dx)>Math.abs(dy))c+=dx>0?1:-1;else r+=dy>0?1:-1;
    swiped=true;if(r>=0&&r<R&&c>=0&&c<C)trySwap(down.i,r*C+c);
  });
  stage.onclick=function(e){
    if(swiped){swiped=false;return}
    if(busy)return;
    if(e.target.closest('[data-m3="hint"]')){
      if(!hints)return;var mv=findMove();if(!mv)return;hints--;sel=-1;draw();sfx('hint');
      mv.forEach(function(i){var el=stage.querySelector('[data-i="'+i+'"]');if(el)el.classList.add('hint')});return;
    }
    var cell=e.target.closest('.m3-cell[data-i]');if(!cell)return;
    var i=+cell.dataset.i;
    if(sel<0){sel=i;sfx('select');draw();return}
    if(sel===i){sel=-1;draw();return}
    if(adj(sel,i)){trySwap(sel,i);return}
    sel=i;sfx('select');draw();
  };
  keyHandler=function(e){return spatialNav(stage,e)};
  if(LOCAL)window.__nmGame={match:function(){return{board:b.map(function(t){return t&&t.id}),busy:busy,C:C,R:R,moves:moves,findMove:findMove}}};
  cleanup=function(){timers.forEach(clearTimeout)};
}

/* 10. sentence fishing: a sentence with one word blanked out; catch the fish carrying that word */
function gFishing(stage,setStats){
  var all=blankList(),rounds=pick(all,10),N=rounds.length,narrow=innerWidth<600,FISH=4;
  var vocab={};deck.words.forEach(function(w){vocab[w.w.toLowerCase()]=1});
  /* words to put on the other fish: vocabulary plus words from the other sentences */
  var pool={};
  deck.words.forEach(function(w){if(/^[A-Za-z](?:[A-Za-z']*[A-Za-z])?$/.test(w.w)&&w.w.length>=2)pool[w.w.toLowerCase()]=w.w});
  all.forEach(function(x){x.cands.forEach(function(c){var k=c.core.toLowerCase();if(!pool[k])pool[k]=c.core})});
  var ri=0,mistakes=0,cur=null,fish=[],alive=true,started=false,busy=true,raf=0,last=0,timers=[];
  stage.innerHTML='<div class="fs"><div class="fs-sent" id="fsSent" aria-live="polite"></div><div class="fs-pond" id="pond">'+
    '<div class="bl-start"><p>문장의 빈칸에 들어갈 낱말 물고기를 낚아요. 문장 '+N+'개가 나와요.</p><button class="btn primary" id="fsGo">'+icon('play','fill')+'시작하기<span class="kbd hide-sm">Enter</span></button></div></div></div>';
  var pond=stage.querySelector('#pond'),sentEl=stage.querySelector('#fsSent');
  function upd(){setStats('문장 '+Math.min(ri+1,N)+'/'+N+' · 실수 '+mistakes)}
  function sentence(filled){
    sentEl.innerHTML=cur.toks.map(function(t,i){
      if(i!==cur.c.i)return'<span>'+esc(t)+'</span>';
      return'<span>'+esc(cur.c.pre)+'<span class="fs-blank'+(filled?' got':'')+'" style="--bw:'+(cur.c.core.length*.62+1.2).toFixed(1)+'em">'+(filled?esc(cur.c.core):'&nbsp;')+'</span>'+esc(cur.c.post)+'</span>';
    }).join(' ');
    sentEl.setAttribute('aria-label',filled?cur.s:cur.toks.map(function(t,i){return i===cur.c.i?cur.c.pre+'빈칸'+cur.c.post:t}).join(' '));
  }
  function next(){
    if(!alive)return;
    if(ri>=N){end();return}
    var r=rounds[ri];
    /* blank a vocabulary word when the sentence has one, otherwise its longest word */
    var vs=r.cands.filter(function(c){return vocab[c.core.toLowerCase()]});
    var c=vs.length?rnd(vs):r.cands.slice().sort(function(a,b){return b.core.length-a.core.length})[0];
    cur={s:r.s,toks:r.toks,c:c};
    var ans=c.core,cap=c.i===0&&/^[A-Z]/.test(ans);
    var others=pick(Object.keys(pool).filter(function(k){return k!==ans.toLowerCase()}),FISH-1).map(function(k){var w=pool[k];return cap?w.charAt(0).toUpperCase()+w.slice(1):w});
    var words=shuffle([ans].concat(others));
    sentence(false);
    pond.innerHTML='';
    var W=pond.clientWidth,H=pond.clientHeight,lanes=shuffle(words.map(function(_,i){return i}));
    fish=words.map(function(w,i){
      var el=document.createElement('button');
      el.className='fish c'+(i%4);
      el.innerHTML=esc(w)+'<span class="k" aria-hidden="true">'+(i+1)+'</span>';
      el.setAttribute('aria-label',w+' (숫자 '+(i+1)+')');
      pond.appendChild(el);
      var fw=el.offsetWidth,fh=el.offsetHeight,sp=(narrow?34:46)+ri*4+Math.random()*24;
      var f={el:el,w:w,ok:w===ans,x:Math.random()*Math.max(1,W-fw),y:(lanes[i]+.5)*H/words.length-fh/2,fw:fw,vx:Math.random()<.5?sp:-sp,away:0,caught:false};
      el.onclick=function(){hit(f)};
      return f;
    });
    busy=false;upd();
  }
  function hit(f){
    if(busy||f.caught||f.away>0)return;
    if(f.ok){
      busy=true;f.caught=true;f.el.classList.add('caught');sfx('ok');sentence(true);say(cur.s);
      var line=document.createElement('span');line.className='fs-line';pond.appendChild(line);f.line=line;
      timers.push(setTimeout(function(){ri++;next()},1700));
    }else{
      mistakes++;sfx('bad');f.el.classList.add('wrong');f.away=1;upd();
      timers.push(setTimeout(function(){f.away=0;f.el.classList.remove('wrong')},1000));
    }
  }
  function loop(t){
    if(!alive)return;
    var dt=Math.min(.05,(t-last)/1000),W=pond.clientWidth;last=t;
    fish.forEach(function(f){
      if(f.caught){
        /* reel the fish up on the line */
        f.y-=260*dt;f.line.style.left=(f.x+f.fw/2)+'px';f.line.style.height=Math.max(0,f.y+4)+'px';
      }else{
        var v=f.vx*(f.away?2.4:1)*(reduceMotion?.6:1);f.x+=v*dt;
        if(f.x<0){f.x=0;f.vx=Math.abs(f.vx)}else if(f.x+f.fw>W){f.x=W-f.fw;f.vx=-Math.abs(f.vx)}
        f.el.classList.toggle('lf',f.vx<0);
      }
      f.el.style.transform='translate('+f.x.toFixed(1)+'px,'+(f.y+(f.caught?0:Math.sin(t/400+f.fw)*4)).toFixed(1)+'px)';
    });
    raf=requestAnimationFrame(loop);
  }
  function end(){
    if(!alive)return;alive=false;cancelAnimationFrame(raf);
    finish('fishing',mistakes<=1?3:mistakes<=4?2:1,N+'개 문장의 빈칸을 채웠어요. 실수는 '+mistakes+'번이에요.');
  }
  function begin(){if(started)return;started=true;sfx('start');playMode();next();last=performance.now();raf=requestAnimationFrame(loop)}
  stage.querySelector('#fsGo').onclick=begin;stage.querySelector('#fsGo').focus({preventScroll:true});
  cur={s:'',toks:['?'],c:{i:-1}};upd();
  keyHandler=function(e){
    if(!started){if(e.key==='Enter'){begin();return true}return false}
    var d='1234'.indexOf(e.key);if(d<0||!fish[d])return false;
    hit(fish[d]);return true;
  };
  if(LOCAL)window.__nmGame={fishing:function(){return{busy:busy,fish:fish.map(function(f){return{w:f.w,ok:f.ok}})}}};
  cleanup=function(){alive=false;cancelAnimationFrame(raf);timers.forEach(clearTimeout)};
}

/* 11. letter ladder (Wordle style): spell the word for the meaning in six tries.
   green = right letter, right place; yellow = in the word, elsewhere; grey = not in the word */
function gLadder(stage,setStats){
  var list=pick(ladderWords(),5),N=list.length,MAXR=6;
  var ri=0,word,L,rows,cur,keys,solved=0,tries=0,busy=false,bad=false,fresh=-1,timers=[];
  function setup(){word=list[ri].w.toLowerCase();L=word.length;rows=[];cur='';keys={};fresh=-1;draw()}
  function judge(g){
    var res=new Array(L).fill('x'),left={},i;
    for(i=0;i<L;i++){if(g[i]===word[i])res[i]='g';else left[word[i]]=(left[word[i]]||0)+1}
    for(i=0;i<L;i++)if(res[i]!=='g'&&left[g[i]]){res[i]='y';left[g[i]]--}
    return res;
  }
  var RANK={x:1,y:2,g:3};
  function upd(){setStats('낱말 '+Math.min(ri+1,N)+'/'+N+' · 맞힘 '+solved)}
  function draw(){keepFocus(stage,function(){
    var hint=rows.length>=3&&rows.length<MAXR&&!(rows.length&&rows[rows.length-1].g===word);
    var g='';
    for(var r=0;r<MAXR;r++){
      for(var c=0;c<L;c++){
        var ch='',cls='ld-cell',st='';
        if(r<rows.length){ch=rows[r].g[c];cls+=' '+rows[r].res[c]+(r===fresh?' flip':'');if(r===fresh)st=' style="animation-delay:'+(c*.09)+'s"'}
        else if(r===rows.length&&c<cur.length){ch=cur[c];cls+=' typed'+(bad?' bad':'')}
        else if(r===rows.length&&bad)cls+=' bad';
        g+='<span class="'+cls+'"'+st+'>'+esc(ch)+'</span>';
      }
    }
    var kb=['qwertyuiop','asdfghjkl','zxcvbnm'].map(function(row,ri2){
      var h=row.split('').map(function(k){return'<button class="ld-key '+(keys[k]||'')+'" data-k="'+k+'" data-key="k'+k+'" aria-label="'+k+(keys[k]==='g'?', 맞은 자리':keys[k]==='y'?', 다른 자리':keys[k]==='x'?', 없는 글자':'')+'">'+k+'</button>'}).join('');
      if(ri2===2)h='<button class="ld-key wide" data-k="enter" data-key="kenter">확인</button>'+h+'<button class="ld-key wide" data-k="back" data-key="kback" aria-label="한 글자 지우기">⌫</button>';
      return'<div class="ld-krow">'+h+'</div>';
    }).join('');
    stage.innerHTML='<div class="ld"><div class="ld-q"><small>이 뜻의 낱말은?</small><b>'+esc(list[ri].m)+'</b><span class="tag">'+L+'글자</span>'+(hint?'<span class="tag">첫 글자 '+esc(word[0])+'</span>':'')+'</div>'+
      '<div class="ld-main"><div class="ld-grid" style="--n:'+L+'" role="grid" aria-label="'+(MAXR-rows.length)+'번 더 쓸 수 있어요">'+g+'</div><div class="ld-keys">'+kb+'</div></div></div>';
  });upd()}
  function press(k){
    if(busy)return;bad=false;fresh=-1;
    if(k==='enter'){submit();return}
    if(k==='back'){if(cur.length){cur=cur.slice(0,-1);sfx('tap')}}
    else if(cur.length<L){cur+=k;sfx('tap')}
    draw();
  }
  function submit(){
    if(cur.length<L){bad=true;sfx('bad');draw();toast(L+'글자를 모두 채워 주세요');return}
    var res=judge(cur);rows.push({g:cur,res:res});tries++;
    cur.split('').forEach(function(ch,i){if(!keys[ch]||RANK[res[i]]>RANK[keys[ch]])keys[ch]=res[i]});
    var won=cur===word;cur='';fresh=rows.length-1;
    if(won){solved++;busy=true;sfx('ok');say(word);draw();toast(word+' = '+list[ri].m);timers.push(setTimeout(nextWord,1800));return}
    if(rows.length>=MAXR){busy=true;sfx('lose');say(word);draw();toast('정답은 '+word+' ('+list[ri].m+')');timers.push(setTimeout(nextWord,2400));return}
    sfx('place');draw();
  }
  function nextWord(){
    busy=false;ri++;
    if(ri<N){setup();return}
    finish('ladder',solved===N&&tries<=N*3.6?3:solved>=N-1?2:1,N+'개 중 '+solved+'개를 맞혔어요. 모두 '+tries+'번 써 봤어요.');
  }
  setup();
  stage.onclick=function(e){var b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  keyHandler=function(e){
    if(/^[a-zA-Z]$/.test(e.key)){press(e.key.toLowerCase());return true}
    if(e.key==='Backspace'){press('back');return true}
    if(e.key==='Enter'){press('enter');return true}
    return false;
  };
  if(LOCAL)window.__nmGame={ladder:function(){return{word:word,busy:busy,rows:rows.length}}};
  cleanup=function(){timers.forEach(clearTimeout)};
}

/* 12. whack-a-mole: moles pop up holding words; hit only the one that matches the meaning. 60 seconds, 15 to catch */
function gMole(stage,setStats){
  var ws=uniqueWords(deck.words),TIME=60,GOAL=15;
  var holes=[],target=null,correct=0,mistakes=0,started=false,alive=true,start=0,nextSpawn=0,lastTarget=0,tick=0,timers=[];
  stage.innerHTML='<div class="ml"><div class="bl-q"><small>이 뜻의 낱말을 든 두더지를 잡아요</small><b id="mlQ">?</b></div><div class="ml-wrap" style="max-width:min(820px,calc((100dvh - '+(innerWidth<600?260:350)+'px) * 1.45 + 20px))"><div class="ml-field">'+
    [0,1,2,3,4,5,6,7,8].map(function(i){return'<button class="ml-hole" data-h="'+i+'" aria-label="'+(i+1)+'번 구멍, 비어 있어요"><span class="ml-mole"><span class="ml-face"></span><b class="ml-sign"></b></span><span class="k" aria-hidden="true">'+(i+1)+'</span></button>'}).join('')+
    '</div><div class="bl-start"><p>위에 나온 뜻의 낱말을 든 두더지만 잡아요. 60초 동안 '+GOAL+'마리를 잡아 보세요!</p><button class="btn primary" id="mlGo">'+icon('play','fill')+'시작하기<span class="kbd hide-sm">Enter</span></button></div></div></div>';
  [].forEach.call(stage.querySelectorAll('.ml-hole'),function(el,i){holes.push({el:el,sign:el.querySelector('.ml-sign'),t:null,up:false,until:0,lock:false})});
  var wrap=stage.querySelector('.ml-wrap');
  function left(){return Math.max(0,TIME-Math.floor((performance.now()-start)/1000))}
  function upd(){setStats('잡음 '+correct+'/'+GOAL+' · '+(started?left():TIME)+'초')}
  function newTarget(){
    var pool=ws.filter(function(w){return w!==target});target=rnd(pool);lastTarget=0;
    stage.querySelector('#mlQ').textContent=target.m;
  }
  function show(h,t,now){
    h.t=t;h.sign.textContent=t.w;h.up=true;h.until=now+Math.max(1100,1900-correct*50);
    h.el.classList.add('up');h.el.setAttribute('aria-label',(holes.indexOf(h)+1)+'번 구멍, '+t.w);
    fit(h.sign);
  }
  function hide(h){h.up=false;h.lock=false;h.el.classList.remove('up','hit','wrong');h.el.setAttribute('aria-label',(holes.indexOf(h)+1)+'번 구멍, 비어 있어요')}
  function spawn(now){
    var free=holes.filter(function(h){return!h.up});if(!free.length)return;
    var h=rnd(free),upNow=holes.filter(function(x){return x.up}).map(function(x){return x.t});
    /* the right mole shows up often, and always within about two seconds */
    var t;
    if(upNow.indexOf(target)<0&&(Math.random()<.45||now-lastTarget>2000)){t=target;lastTarget=now}
    else{var d=ws.filter(function(w){return w!==target&&upNow.indexOf(w)<0});if(!d.length)return;t=rnd(d)}
    show(h,t,now);
  }
  function step(){
    var now=performance.now();
    if(!lastTarget)lastTarget=now;
    holes.forEach(function(h){if(h.up&&!h.lock&&now>h.until)hide(h)});
    if(now>=nextSpawn){spawn(now);nextSpawn=now+Math.max(450,850-correct*25)}
    upd();
    if(left()<=0)end();
  }
  function hit(i){
    var h=holes[i];if(!started||!alive||!h||!h.up||h.lock)return;
    h.lock=true;
    if(h.t===target){
      correct++;sfx('pop');h.el.classList.add('hit');
      var g=document.createElement('span');g.className='gain';g.setAttribute('aria-hidden','true');g.textContent=h.t.w+' = '+h.t.m;wrap.appendChild(g);
      timers.push(setTimeout(function(){g.remove()},900));
      timers.push(setTimeout(function(){hide(h)},320));
      if(correct>=GOAL){end();return}
      newTarget();
    }else{
      mistakes++;sfx('bad');h.el.classList.add('wrong');
      timers.push(setTimeout(function(){hide(h)},420));
    }
    upd();
  }
  function end(){
    if(!alive)return;alive=false;clearInterval(tick);
    var secs=Math.round((performance.now()-start)/1000);
    finish('mole',correct>=12&&mistakes<=3?3:correct>=7?2:1,(correct>=GOAL?secs+'초 만에 ':'60초 동안 ')+correct+'마리를 잡았어요. 잘못 잡은 두더지는 '+mistakes+'마리예요.');
  }
  function begin(){
    if(started)return;started=true;stage.querySelector('.ml-wrap .bl-start').remove();sfx('start');playMode();
    newTarget();start=performance.now();nextSpawn=start+300;tick=setInterval(step,100);
  }
  upd();
  stage.querySelector('#mlGo').onclick=begin;stage.querySelector('#mlGo').focus({preventScroll:true});
  stage.querySelector('.ml-field').onclick=function(e){var b=e.target.closest('[data-h]');if(b)hit(+b.dataset.h)};
  keyHandler=function(e){
    if(!started){if(e.key==='Enter'){begin();return true}return false}
    var d='123456789'.indexOf(e.key);if(d<0)return false;hit(d);return true;
  };
  if(LOCAL)window.__nmGame={mole:function(){return{target:target&&target.w,up:holes.map(function(h){return h.up&&!h.lock?h.t.w:null})}}};
  cleanup=function(){alive=false;clearInterval(tick);timers.forEach(clearTimeout)};
}

function parseLine(line){
  var seps=['\t',',',' - ','=',':','/'];
  for(var i=0;i<seps.length;i++){var k=line.indexOf(seps[i]);if(k>0){var w=line.slice(0,k).trim(),m=line.slice(k+seps[i].length).trim();if(w&&m)return{w:w,m:m}}}
  return null;
}
function unq(s){s=s.trim();if(s.length>1&&s[0]==='"'&&s[s.length-1]==='"')s=s.slice(1,-1).replace(/""/g,'"');return s.trim()}
/* a unit header line starts a new unit: "Lesson 1 My Name Is Amy", "Unit 3 ...", "단원 2 ..." or "[단원] 이름" */
function unitHeader(line){
  if(/\t/.test(line))return null;
  var m=/^\[(?:단원|unit|lesson)\]\s*(.+)$/i.exec(line);if(m)return m[1].trim();
  return/^(?:lesson|unit|단원)\s*\d+/i.test(line)?line:null;
}
function parseFile(text){
  var mode='auto',units=[],cur=null,skipped=0,headed=false;
  function unit(){if(!cur){cur={name:'',words:[],sentences:[]};units.push(cur)}return cur}
  text.replace(/^﻿/,'').split(/\r?\n/).forEach(function(raw){
    var line=raw.trim();if(!line||line[0]==='#')return;
    var hd=unitHeader(line);
    if(hd!==null){cur={name:hd,words:[],sentences:[]};units.push(cur);mode='auto';headed=true;return}
    var h=line.replace(/[\s\[\]:,]/g,'').toLowerCase();
    if(/^(낱말|단어|words?)$/.test(h)){mode='w';return}
    if(/^(문장|표현|sentences?)$/.test(h)){mode='s';return}
    if(mode==='s'){var s=unq(line);if(s.split(/\s+/).length>=2)unit().sentences.push(s);else skipped++;return}
    var p=parseLine(line);
    if(p){
      p={w:unq(p.w),m:unq(p.m)};
      if(/^(낱말|단어|word)$/i.test(p.w)&&/^(뜻|meaning)$/i.test(p.m))return;
      if(p.w&&p.m){unit().words.push(p);return}
    }
    if(mode==='auto'&&line.split(/\s+/).length>=2){unit().sentences.push(unq(line));return}
    skipped++;
  });
  units=units.filter(function(u){return u.words.length||u.sentences.length});
  var w=0,s=0;units.forEach(function(u){w+=u.words.length;s+=u.sentences.length});
  return{units:units,headed:headed,words:w,sentences:s,skipped:skipped};
}

    '<section class="panel"><h3>한꺼번에 붙여 넣기</h3><p class="hint">고르고 있는 단원에 한 줄에 하나씩 <b>낱말, 뜻</b>으로 붙여 넣으세요. 엑셀에서 두 칸을 복사해도 돼요.</p>'+
      '<label class="lbl" for="bulk">붙여 넣을 내용</label><textarea class="tx" id="bulk" placeholder="apple, 사과&#10;광합성, 식물이 햇빛으로 양분을 만드는 일"></textarea><div><button class="btn small" id="bulkAdd">'+icon('plus')+'목록에 더하기</button></div></section>'+
    '<section class="panel"><h3>문장 (문장 퍼즐용)</h3><p class="hint">고르고 있는 단원의 문장을 한 줄에 하나씩 써 주세요. 띄어쓰기 단위로 조각이 나뉘어요.</p><label class="lbl" for="sents">문장 목록</label><textarea class="tx" id="sents" style="min-height:160px"></textarea></section></div></div>'+
    '<div class="savebar"><p id="saveMsg" aria-live="polite"></p><button class="btn primary" id="saveBtn">'+icon('upload')+(LOCAL?'이 컴퓨터에 저장':'저장하고 학생에게 보내기')+'</button></div>';
  var $=function(id){return document.getElementById(id)};
  $('t-title').value=draft.title;
  function U(){return draft.units[ui]}
  function syncSents(){U().sentences=$('sents').value.split('\n')}
  function unitLabel(u,i){return(u.name||'이름 없는 단원')+' ('+u.words.filter(function(x){return x.w.trim()&&x.m.trim()}).length+'개)'}
  function units(){
    $('unitSel').innerHTML=draft.units.map(function(u,i){return'<option value="'+i+'"'+(i===ui?' selected':'')+'>'+esc(unitLabel(u,i))+'</option>'}).join('');
    $('delUnit').disabled=draft.units.length<2;
    $('u-name').value=U().name;$('sents').value=U().sentences.join('\n');
    rows();
  }
  function rows(){
    var ws=U().words;if(!ws.length)ws.push({w:'',m:''});
    $('wrows').innerHTML=ws.map(function(x,i){
      return'<div class="wrow"><span class="n">'+(i+1)+'</span><input class="tx" id="w-'+i+'" data-i="'+i+'" data-f="w" maxlength="40" aria-label="'+(i+1)+'번 낱말"><input class="tx" id="m-'+i+'" data-i="'+i+'" data-f="m" maxlength="40" aria-label="'+(i+1)+'번 뜻"><button data-del="'+i+'" aria-label="'+(i+1)+'번 지우기" title="지우기">'+icon('x')+'</button></div>';
    }).join('');
    ws.forEach(function(x,i){$('w-'+i).value=x.w;$('m-'+i).value=x.m});
    status();
  }
  function status(){
    syncSents();
    var n=U().words.filter(function(x){return x.w.trim()&&x.m.trim()}).length,s=cleanSents(U().sentences).length;
    $('saveMsg').className='';$('saveMsg').textContent='단원 '+draft.units.length+'개. 이 단원: 낱말 '+n+'개, 문장 '+s+'개'+(n<4?' (낱말이 4개 이상이어야 모든 놀이가 열려요)':'');
    var o=$('unitSel').options[ui];if(o)o.textContent=unitLabel(U(),ui);
  }
  units();
  $('unitSel').onchange=function(){syncSents();ui=+this.value;units()};
  $('u-name').addEventListener('input',function(){U().name=this.value;status()});
  $('addUnit').onclick=function(){syncSents();draft.units.push({name:'Lesson '+(draft.units.length+1),words:[],sentences:[]});ui=draft.units.length-1;units();$('u-name').focus();$('u-name').select()};
  $('delUnit').onclick=function(){
    if(draft.units.length<2)return;
    var b=this;if(!b.dataset.sure){b.dataset.sure='1';b.lastChild.textContent='한 번 더 누르면 지워져요';setTimeout(function(){if(b.isConnected){delete b.dataset.sure;b.lastChild.textContent='이 단원 지우기'}},3000);return}
    draft.units.splice(ui,1);ui=Math.max(0,ui-1);delete b.dataset.sure;b.lastChild.textContent='이 단원 지우기';units();toast('단원을 지웠어요. 저장해야 학생에게 반영돼요');
  };
  $('wrows').addEventListener('input',function(e){var t=e.target;if(t.dataset.f){U().words[+t.dataset.i][t.dataset.f]=t.value;status()}});
  $('wrows').addEventListener('click',function(e){var d=e.target.closest('[data-del]');if(!d)return;U().words.splice(+d.dataset.del,1);rows()});
  $('sents').addEventListener('input',status);
  $('addRow').onclick=function(){U().words.push({w:'',m:''});rows();var i=U().words.length-1;$('w-'+i).focus()};
  if($('clearSample'))$('clearSample').onclick=function(){draft.units=[{name:'',words:[],sentences:[]}];ui=0;$('t-title').value='우리 반 낱말';units();this.remove()};
  $('bulkAdd').onclick=function(){
    var lines=$('bulk').value.split('\n').map(function(s){return s.trim()}).filter(Boolean),added=0,bad=[];
    U().words=U().words.filter(function(x){return x.w.trim()||x.m.trim()});
    lines.forEach(function(l){var p=parseLine(l);if(p){U().words.push(p);added++}else bad.push(l)});
    $('bulk').value=bad.join('\n');rows();
    toast(added+'개를 더했어요'+(bad.length?'. 나누지 못한 줄 '+bad.length+'개는 남겨 뒀어요':''));
  };
  var pending=null;
  function readFile(file){
    if(!file)return;
    if(file.size>1024*1024){toast('파일이 너무 커요. 1MB보다 작은 파일을 골라 주세요');return}
    var fr=new FileReader();
    fr.onload=function(){
      var buf=fr.result,text;
      try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{text=new TextDecoder('euc-kr').decode(buf)}catch(e2){text=''}}
      pending=parseFile(text);showPreview(file.name);
    };
    fr.onerror=function(){toast('파일을 읽지 못했어요. 다른 파일로 다시 해 보세요')};
    fr.readAsArrayBuffer(file);
  }
  function showPreview(name){
    var box=$('filePreview'),p=pending;box.hidden=false;
    if(!p.words&&!p.sentences){
      box.innerHTML='<p class="msg-bad">「'+esc(name)+'」에서 낱말이나 문장을 찾지 못했어요. 위 예시처럼 한 줄에 <b>낱말, 뜻</b>을 써 주세요.</p>';pending=null;return;
    }
    var all=[].concat.apply([],p.units.map(function(u){return u.words}));
    var btns=p.headed
      ?'<button class="btn small primary" data-fp="replaceAll">모든 단원을 이걸로 바꾸기</button><button class="btn small" data-fp="addUnits">단원으로 더하기</button>'
      :'<button class="btn small primary" data-fp="replace">이 단원을 이걸로 바꾸기</button><button class="btn small" data-fp="append">이 단원에 더하기</button>';
    box.innerHTML='<p><b>「'+esc(name)+'」</b>에서 '+(p.headed?'단원 <b>'+p.units.length+'개</b>, ':'')+'낱말 <b>'+p.words+'개</b>, 문장 <b>'+p.sentences+'개</b>를 찾았어요'+(p.skipped?' (읽지 못한 줄 '+p.skipped+'개는 뺐어요)':'')+'.</p>'+
      (p.headed?'<p>'+p.units.map(function(u){return esc(u.name)}).join(', ')+'</p>':'')+
      '<div class="strip">'+all.slice(0,6).map(function(w){return'<span><b>'+esc(w.w)+'</b>'+esc(w.m)+'</span>'}).join('')+(all.length>6?'<span>그 밖에 '+(all.length-6)+'개</span>':'')+'</div>'+
      '<div class="tools" style="justify-content:flex-start;margin-top:4px">'+btns+'<button class="btn small" data-fp="cancel">취소</button></div>';
  }
  $('filePreview').addEventListener('click',function(e){
    var b=e.target.closest('[data-fp]');if(!b||!pending)return;var act=b.dataset.fp,p=pending;
    pending=null;$('filePreview').hidden=true;$('fileIn').value='';
    if(act==='cancel')return;
    syncSents();
    if(act==='replaceAll'){draft.units=p.units;ui=0}
    else if(act==='addUnits'){draft.units=draft.units.filter(function(u){return cleanWords(u.words).length||cleanSents(u.sentences).length});ui=draft.units.length;draft.units=draft.units.concat(p.units)}
    else{
      var one=p.units[0]||{words:[],sentences:[]},cw=U().words.filter(function(x){return x.w.trim()||x.m.trim()}),cs=cleanSents(U().sentences);
      if(act==='replace'){U().words=one.words.length?one.words:cw;U().sentences=one.sentences.length?one.sentences:cs}
      else{U().words=cw.concat(one.words);U().sentences=cs.concat(one.sentences)}
    }
    if($('clearSample'))$('clearSample').remove();
    units();toast('넣었어요. 아래 저장 버튼을 눌러야 학생에게 반영돼요');
  });
  $('fileIn').onchange=function(){readFile(this.files&&this.files[0])};
  var fp=$('filePanel');
  fp.addEventListener('dragover',function(e){e.preventDefault();fp.classList.add('drop')});
  fp.addEventListener('dragleave',function(){fp.classList.remove('drop')});
  fp.addEventListener('drop',function(e){e.preventDefault();fp.classList.remove('drop');readFile(e.dataTransfer.files&&e.dataTransfer.files[0])});
  $('copyFmt').onclick=function(){
    var t=$('fmt').textContent;
    function sel(){var r=document.createRange();r.selectNodeContents($('fmt'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('선택했어요. Ctrl+C로 복사하세요')}
    try{navigator.clipboard.writeText(t).then(function(){toast('예시를 복사했어요. 메모장에 붙여 넣어 고쳐 쓰세요')},sel)}catch(e){sel()}
  };
  $('saveBtn').onclick=function(){
    var btn=this,msg=$('saveMsg');syncSents();
    var next=clean({title:$('t-title').value,sample:false,units:draft.units});
    var total=0;next.units.forEach(function(u){total+=u.words.length});
    var nextLib={sets:lib.sets.map(function(s){return s.id===book.id?{id:s.id,name:s.name,title:next.title,sample:false,units:next.units}:s})};
    if(total<3){msg.className='msg-bad';msg.textContent='낱말과 뜻이 모두 채워진 줄이 3개 이상 있어야 저장할 수 있어요.';return}
    if(LOCAL||!artifactNS){
      if(LOCAL){store.set('nm-local-deck',nextLib);lib=cleanLib(nextLib);var keep=sel.slice();useSet(book.id);applySel(keep.length?keep:allUnits());toast('이 컴퓨터에 저장했어요');go('home');return}
      msg.className='msg-bad';msg.textContent='이 화면에서는 저장할 수 없어요. Claude에서 이 페이지를 열어 저장해 주세요.';return;
    }
    btn.disabled=true;msg.className='';msg.textContent='저장하는 중…';
    artifactNS.publish(buildDoc(nextLib)).then(function(){
      msg.className='msg-good';msg.textContent='저장했어요. 새 낱말로 페이지를 다시 불러와요.';
    },function(err){
      btn.disabled=false;var code=err&&err.code;msg.className='msg-bad';
      if(code==='conflict')msg.textContent='다른 곳에서 먼저 저장했어요. 최신 내용으로 다시 불러온 뒤 한 번 더 저장해 주세요.';
      else if(code==='too_large')msg.textContent='내용이 너무 많아요. 낱말이나 문장을 조금 줄여 주세요.';
      else if(code==='rate_limited')msg.textContent='저장을 너무 자주 했어요. 1분쯤 뒤에 다시 눌러 주세요.';
      else if(code==='not_writer'||code==='not_granted'||code==='capability_disabled'||code==='not_declared'||code==='consent_required'){msg.textContent='이 화면은 보기 전용이라 저장할 수 없어요. 이 페이지를 만든 계정으로 열어 주세요.'}
      else msg.textContent='저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.';
    });
  };
}

/* runtime: only editors see the teacher button */
(function(){
  if(!(window.claude&&window.claude.use))return;
  window.claude.use('user').then(function(u){return u?u.canEdit():false}).then(function(ok){
    if(!ok)return;
    return window.claude.use('artifact').then(function(ns){
      artifactNS=ns;canTeach=!!ns;syncTop();if(current==='home')renderHome();else if(current==='start')renderStart();
    });
  }).catch(function(){});
})();

(function(){
  var h=location.hash.replace('#','');
  if(h&&useSet(h)&&setReady(book)){current='home';renderHome()}
  else{book=null;current='start';renderStart()}
  syncTop();
})();
})();
</script>
